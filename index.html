<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinking Like an Economist</title>
<meta name="description" content="Classroom games for teaching economics by discovery, by Rupa Korde.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ============================================================
   THINKING LIKE AN ECONOMIST — design tokens
   Restyled to match wageindicator-life-story.netlify.app: deep
   navy + warm cream + one confident burnt-orange accent, bold
   rounded Overpass headings over Inter body text. --blue is kept
   as the variable name for that navy (it’s still "the house
   colour"); --chalk/--rise/--stamp/--violet stay as the map’s
   categorical topic colours, just re-muted to sit quietly next
   to navy/cream/orange instead of reading as a bright rainbow.
   ============================================================ */
:root{
  --paper:      #FCF8F2;
  --paper-2:    #F3ECDD;
  --panel:      #FFFFFF;
  --ink:        #071C32;
  --ink-soft:   #45536B;
  --ink-faint:  #75839C;
  --rule:       #E7DFCF;
  --rule-strong:#D2C6AA;

  --blue:       #002A60;
  --blue-deep:  #001B40;
  --blue-soft:  #DCE6F2;
  --panel-deep: #001B40;
  --blue-line:  #002A60;

  --chalk:      #A8650A;
  --chalk-bg:   #FBE7B8;
  --chalk-line: #D98B0C;

  --rise:       #1F6F6F;
  --rise-bg:    #DCEEEC;
  --rise-line:  #2A8A8A;

  --stamp:      #8B2E3F;
  --stamp-bg:   #F3DEE1;
  --stamp-line: #A83A4D;

  --violet:     #4F4E82;
  --violet-bg:  #E3E2F0;
  --violet-line:#605FA0;

  --orange:      #E04E04;
  --orange-deep: #B33E03;
  --orange-soft: #FBDDCC;

  --font-display: "Overpass", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;

  --max: 1040px;

  --shadow-xs: 0 1px 2px rgba(7,28,50,.06);
  --shadow-sm: 0 1px 3px rgba(7,28,50,.07), 0 4px 10px rgba(7,28,50,.06);
  --shadow-md: 0 4px 10px rgba(7,28,50,.08), 0 10px 24px rgba(7,28,50,.09);
  --shadow-lg: 0 8px 16px rgba(7,28,50,.10), 0 20px 40px rgba(7,28,50,.14);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:      #04152E;
    --paper-2:    #071F3E;
    --panel:      #0B2648;
    --ink:        #F3ECDD;
    --ink-soft:   #B9C4D6;
    --ink-faint:  #8393AC;
    --rule:       #1C3A63;
    --rule-strong:#2E4F7D;

    --blue:       #6E93D6;
    --blue-deep:  #A9C2EC;
    --blue-soft:  #14294A;
    --panel-deep: #0B2648;

    --chalk:      #F2B25A;
    --chalk-bg:   #3A2A10;
    --chalk-line: #E0993B;

    --rise:       #4FB5B5;
    --rise-bg:    #0F2C2C;
    --rise-line:  #63C9C9;

    --stamp:      #E27A8C;
    --stamp-bg:   #341419;
    --stamp-line: #D9899A;

    --violet:     #9B9AD1;
    --violet-bg:  #201F3A;
    --violet-line:#ADACDE;

    --orange:      #FF7A3D;
    --orange-deep: #FFA06B;
    --orange-soft: #3A1D0E;
  }
}
:root[data-theme="dark"]{
  --paper:      #04152E;
  --paper-2:    #071F3E;
  --panel:      #0B2648;
  --ink:        #F3ECDD;
  --ink-soft:   #B9C4D6;
  --ink-faint:  #8393AC;
  --rule:       #1C3A63;
  --rule-strong:#2E4F7D;

  --blue:       #6E93D6;
  --blue-deep:  #A9C2EC;
  --blue-soft:  #14294A;
  --panel-deep: #0B2648;

  --chalk:      #F2B25A;
  --chalk-bg:   #3A2A10;
  --chalk-line: #E0993B;

  --rise:       #4FB5B5;
  --rise-bg:    #0F2C2C;
  --rise-line:  #63C9C9;

  --stamp:      #E27A8C;
  --stamp-bg:   #341419;
  --stamp-line: #D9899A;

  --violet:     #9B9AD1;
  --violet-bg:  #201F3A;
  --violet-line:#ADACDE;

  --orange:      #FF7A3D;
  --orange-deep: #FFA06B;
  --orange-soft: #3A1D0E;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
img{ max-width:100%; display:block; }
a{ color: var(--blue); text-decoration: none; }
a:hover{ text-decoration: underline; }
:focus-visible{ outline: 2px solid var(--blue); outline-offset: 2px; }

h1,h2,h3,h4{
  font-family: var(--font-display);
  color: var(--ink);
  line-height: 1.14;
  margin: 0 0 .5em;
  text-wrap: balance;
  font-weight: 800;
  letter-spacing: -.01em;
}
h1{ font-size: clamp(2.1rem, 4.4vw, 3.2rem); }
h2{ font-size: clamp(1.5rem, 2.6vw, 1.9rem); }
h3{ font-size: 1.25rem; }
p{ margin: 0 0 1em; max-width: 65ch; }
.prose p, .prose li{ max-width: 68ch; }

.container{ max-width: var(--max); margin: 0 auto; padding: 0 24px; }
.eyebrow{
  font-family: var(--font-body);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-size: .78rem;
  color: var(--orange);
}
.mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

#app{ animation: page-fade-in .28s ease; }
@keyframes page-fade-in{
  from{ opacity: 0; transform: translateY(6px); }
  to{ opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce){
  #app{ animation: none; }
}

/* ---------------- header + ticker ---------------- */
.site-header{
  position: sticky; top:0; z-index: 30;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  box-shadow: var(--shadow-xs);
}
.ticker-wrap{
  background: var(--panel-deep);
  color: #fff;
  overflow: hidden;
  white-space: nowrap;
  border-bottom: 1px solid var(--rule-strong);
}
.ticker{
  display:inline-flex;
  gap: 48px;
  padding: 6px 0;
  animation: ticker-scroll 42s linear infinite;
  font-family: var(--font-mono);
  font-size: .78rem;
  letter-spacing: .03em;
}
.ticker span{ opacity:.92; }
.ticker span b{ color: var(--chalk-line); font-weight:600; }
@keyframes ticker-scroll{
  from{ transform: translateX(0); }
  to{ transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce){
  .ticker{ animation: none; }
}

.nav-row{
  display:flex; align-items:center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding: 16px 0;
}
.brand{
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.25rem;
  color: var(--blue);
  display:flex; flex-direction:column; line-height:1.1;
}
.brand small{
  font-family: var(--font-mono);
  font-size: .62rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 500;
}
.site-nav{ display:flex; gap: 22px; flex-wrap: wrap; }
@media (max-width: 480px){
  .site-nav{ gap: 8px 10px; }
  .site-nav a{ font-size: .84rem; }
}
.site-nav a{
  color: var(--ink); font-weight: 600; font-size: .93rem;
  padding: 4px 0; border-bottom: 2px solid transparent;
}
.site-nav a{ transition: border-color .15s ease, color .15s ease; }
.site-nav a:hover{ text-decoration:none; border-bottom-color: var(--rule-strong); }
.site-nav a.active{ border-bottom-color: var(--orange); color: var(--blue); }

/* ---------------- buttons / tags / stamp ---------------- */
.btn{
  display:inline-flex; align-items:center; gap:.5em;
  font-family: var(--font-display); font-weight: 700; font-size: .95rem;
  padding: 13px 24px; border-radius: 999px;
  border: 1px solid transparent;
  background: var(--orange);
  color: #fff !important;
  cursor:pointer; text-decoration:none !important;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .18s ease, transform .12s ease, background-color .15s ease;
}
.btn:hover{ background: var(--orange-deep); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.btn:active{ transform: translateY(0); box-shadow: var(--shadow-xs); }
.btn.ghost{ background: transparent; border: 1.5px solid var(--blue); color: var(--blue) !important; box-shadow: none; }
.btn.ghost:hover{ background: var(--blue-soft); box-shadow: none; transform: translateY(-2px); }
.btn.disabled{ opacity:.55; cursor:not-allowed; pointer-events:none; background: var(--ink-faint); border-color: var(--ink-faint); box-shadow:none; transform:none; }

.tag{
  font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase;
  letter-spacing: .05em; padding: 3px 9px; border-radius: 2px;
  background: var(--blue-soft); color: var(--blue);
  display:inline-block;
  align-self: flex-start; /* prevents a lone .tag from stretching full-width as a direct child of a flex column, e.g. .card */
}
.tag.live{ background: var(--rise-bg); color: var(--rise); }
.tag.chalk{ background: var(--chalk-bg); color: var(--chalk); }
.tag.stamp{ background: var(--stamp-bg); color: var(--stamp); }
.tag.violet{ background: var(--violet-bg); color: var(--violet); }

.stamp-badge{
  display:inline-block;
  font-family: var(--font-mono);
  font-size: .68rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--stamp);
  border: 1.5px solid var(--stamp);
  padding: 5px 10px;
  border-radius: 2px;
  transform: rotate(-3deg);
  background: var(--stamp-bg);
}

/* ---------------- hero / ledger spread ----------------
   Every page’s top band — home, games, topics, about, terms,
   contact, and every individual game/resource page — shares this
   one dark-navy treatment, so the whole site reads as one system
   rather than a light site with one dark page bolted on. */
.hero{
  padding: 56px 0 40px;
  background: var(--panel-deep);
  border-bottom: 1px solid rgba(255,255,255,.15);
}
.hero .eyebrow{ color: var(--chalk-line); }
.hero h1{ color: #fff; }
.hero p.lead{ color: rgba(255,255,255,.8); font-size: 1.13rem; max-width: 46ch; }
.hero .subnav{ border-bottom-color: rgba(255,255,255,.18); }
.hero .subnav a{ color: rgba(255,255,255,.65); }
.hero .subnav a:hover{ color: #fff; }
.hero .subnav a.active{ color: var(--chalk-line); border-bottom-color: var(--chalk-line); }
.hero .stamp-badge{ color: var(--chalk-line); border-color: var(--chalk-line); background: rgba(255,255,255,.08); }
.hero-home .index-card{
  background: rgba(255,255,255,.08);
  border-color: rgba(255,255,255,.18);
  border-left-color: var(--orange);
  box-shadow: none;
}
.hero-home .index-card h4{ color: rgba(255,255,255,.62); }
.hero-home .stat-row{ color: #fff; border-bottom-color: rgba(255,255,255,.18); }
.hero-home .stat-row .n{ color: var(--chalk-line); }
.hero .btn.ghost{ border-color: rgba(255,255,255,.55); color: #fff !important; }
.hero .btn.ghost:hover{ background: rgba(255,255,255,.12); }
.ledger-spread{
  display:grid; grid-template-columns: 1.3fr .9fr; gap: 40px; align-items: start;
}
@media (max-width: 760px){ .ledger-spread{ grid-template-columns: 1fr; } }
.hero-actions{ display:flex; gap: 14px; margin-top: 22px; flex-wrap: wrap; }

.hero-right{ display:flex; flex-direction:column; gap: 22px; }
.hero-art{ display:block; width:100%; max-width: 230px; height:auto; overflow: visible; margin: 0 auto; }
.hero-card{ animation: card-float 5s ease-in-out infinite; }
@keyframes card-float{
  0%, 100%{ transform: translateY(0); }
  50%{ transform: translateY(-7px); }
}
@media (max-width: 760px){ .hero-art{ max-width: 170px; } }
@media (prefers-reduced-motion: reduce){ .hero-card{ animation: none; } }

/* ---------------- scroll-reveal ---------------- */
.reveal{ opacity: 0; transform: translateY(18px); transition: opacity .55s ease, transform .55s ease; }
.reveal.in{ opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce){
  .reveal{ opacity:1; transform:none; transition:none; }
}

.index-card{
  background: var(--panel);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--blue);
  border-radius: 3px;
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
}
.index-card h4{
  font-family: var(--font-mono); font-size: .72rem; letter-spacing:.1em;
  text-transform: uppercase; color: var(--ink-faint); margin: 0 0 14px;
}
.stat-row{
  display:flex; justify-content: space-between; align-items: baseline;
  padding: 8px 0; border-bottom: 1px dashed var(--rule);
  font-size: .92rem;
}
.stat-row:last-child{ border-bottom:none; }
.stat-row .n{ font-family: var(--font-mono); font-weight:600; color: var(--blue); font-size: 1rem; }

/* ---------------- sections ---------------- */
section{ padding: 56px 0; }
section.alt{ background: var(--paper-2); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.section-head{ max-width: 620px; margin-bottom: 30px; }
.section-head p{ color: var(--ink-soft); }

.grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 24px; }
.card{
  background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
  padding: 0; display:flex; flex-direction:column; overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .22s ease, transform .22s ease, border-color .22s ease;
}
.card:hover{ box-shadow: var(--shadow-lg); transform: translateY(-6px); border-color: var(--rule-strong); }
.card-band{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding: 16px 20px;
  background: var(--blue-soft);
}
.card-icon{
  width:36px; height:36px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 2px 6px rgba(16,26,48,.18);
  background: var(--blue);
}
.card-body{ padding: 18px 24px 24px; display:flex; flex-direction:column; flex:1; }
.card h3{ margin-bottom: .3em; }
.card .muted{ color: var(--ink-soft); font-size: .93rem; }
.card .tags{ margin: 10px 0 14px; display:flex; gap:8px; flex-wrap:wrap; }
.card .spacer{ flex:1; }

/* ---------------- subway map ---------------- */
.map-legend{ display:flex; gap: 18px; flex-wrap: wrap; margin-top: 18px; font-size: .85rem; color: var(--ink-soft); }
.map-legend .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align: -1px; }
.subway-fig{ margin: 0; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
.subway-fig svg{ width:100%; min-width: 640px; height:auto; display:block; }
.subway-fig figcaption{ margin-top: 14px; color: var(--ink-soft); font-size: .88rem; }
.subway-fig a text{ fill: var(--ink); font-family: var(--font-body); transition: fill .15s ease; }
.subway-fig a:hover text{ fill: var(--blue); }
.subway-fig circle.station{ transition: stroke-width .15s ease, filter .15s ease; }
.subway-fig a:hover circle.station{ stroke-width: 4; filter: drop-shadow(0 3px 6px rgba(16,26,48,.28)); }

/* ---------------- game overview / notes ---------------- */
.game-head{ display:flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items:flex-start; margin-bottom: 8px; }
.subnav{
  display:flex; gap: 6px; flex-wrap: wrap; margin: 22px 0 34px;
  border-bottom: 1px solid var(--rule); padding-bottom: 2px;
}
.subnav a{
  font-family: var(--font-mono); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--ink-soft); padding: 8px 12px; border-bottom: 2px solid transparent;
}
.subnav a:hover{ text-decoration:none; color: var(--ink); }
.subnav a.active{ color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }

.ledger-note{
  border-left: 3px solid var(--rule-strong);
  padding-left: 22px;
  position: relative;
}
.ledger-note::before{
  content:"";
  position:absolute; left:-1px; top:0; bottom:0; width:1px;
  background: repeating-linear-gradient(to bottom, var(--rule-strong) 0 6px, transparent 6px 12px);
  display:none;
}
.at-a-glance{
  display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 16px; margin: 20px 0 30px;
}
.at-a-glance .item{
  background: var(--paper-2); border: 1px solid var(--rule); border-radius: 3px;
  padding: 12px 14px;
}
.at-a-glance .item .k{ font-family: var(--font-mono); font-size: .68rem; text-transform:uppercase; letter-spacing:.08em; color: var(--ink-faint); }
.at-a-glance .item .v{ font-size: .95rem; margin-top: 3px; }

.category-block{
  border: 1px solid var(--rule); border-radius: 4px; padding: 20px 22px; margin-bottom: 18px;
  background: var(--panel);
}
.category-block h4{ font-family: var(--font-display); font-size: 1.08rem; margin: 0 0 6px; }
.category-block .count{ font-family: var(--font-mono); font-size: .78rem; color: var(--ink-faint); }
.condition-example{
  border-top: 1px dashed var(--rule); margin-top: 12px; padding-top: 12px;
}
.condition-example .title{ font-weight: 600; font-size: .95rem; }
.condition-example .debrief{ color: var(--blue); font-size: .85rem; font-family: var(--font-mono); }
.discussion-q{
  margin-top: 12px; padding: 10px 14px; background: var(--chalk-bg); border-radius: 3px;
  font-size: .9rem; color: var(--chalk);
}

.glossary dt{ font-weight: 700; font-family: var(--font-display); font-size: 1.02rem; margin-top: 16px; }
.glossary dd{ margin: 4px 0 0; color: var(--ink-soft); }

/* ---------------- quiz ---------------- */
.quiz-progress{
  font-family: var(--font-mono); font-size: .85rem; color: var(--ink-soft); margin-bottom: 18px;
}
.quiz-q{
  border: 1px solid var(--rule); border-radius: 4px; padding: 18px 20px; margin-bottom: 16px; background: var(--panel);
}
.quiz-q .qn{ font-family: var(--font-mono); font-size: .74rem; color: var(--ink-faint); }
.quiz-q .qtext{ font-weight: 600; margin: 6px 0 12px; }
.quiz-opt{ display:flex; align-items:flex-start; gap: 10px; padding: 8px 0; cursor:pointer; font-size: .95rem; }
.quiz-opt input{ margin-top: 4px; accent-color: var(--blue); }
.quiz-q.graded.correct{ border-color: var(--rise-line); }
.quiz-q.graded.wrong{ border-color: var(--stamp-line); }
.quiz-explain{ display:none; margin-top: 10px; padding: 10px 12px; border-radius: 3px; font-size: .88rem; }
.quiz-q.graded .quiz-explain{ display:block; }
.quiz-q.graded.correct .quiz-explain{ background: var(--rise-bg); color: var(--rise); }
.quiz-q.graded.wrong .quiz-explain{ background: var(--stamp-bg); color: var(--stamp); }
.quiz-opt.opt-correct{ font-weight:700; }
.quiz-score{
  border: 2px solid var(--blue); border-radius: 4px; padding: 20px 24px; margin-bottom: 24px;
  background: var(--blue-soft);
  box-shadow: var(--shadow-sm);
  display:none;
}
.quiz-score.show{ display:block; }
.quiz-score .big{ font-family: var(--font-mono); font-size: 2rem; color: var(--blue); font-weight:600; }

/* ---------------- about ---------------- */
.about-layout{ display:grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: start; }
@media (max-width: 640px){ .about-layout{ grid-template-columns: 1fr; } }
/* A colour-ring monogram badge — every one of the site’s five topic
   colours in one place, standing in for a portrait until a real photo
   exists. To swap in a photo later: put it at assets/img/rupa-korde.jpg
   and replace .portrait’s two inner divs with a single <img>; .portrait
   img below already has the fill/crop rule ready for that swap. */
.portrait{
  position:relative; width:100%; max-width:230px; aspect-ratio:1; margin: 0 auto;
  border-radius:50%; padding:9px;
  background: conic-gradient(from 200deg, var(--blue), var(--rise), var(--violet), var(--chalk), var(--stamp), var(--blue));
  box-shadow: var(--shadow-md);
}
.portrait-inner{
  position:absolute; inset:9px; border-radius:50%; background: var(--panel);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display); font-weight:600; font-size:3.4rem; color: var(--ink);
}
.portrait img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }

.editor-note{
  border-left: 3px solid var(--chalk-line); background: var(--chalk-bg); padding: 10px 14px;
  font-size: .87rem; color: var(--chalk); margin: 0 0 1.4em; border-radius: 0 3px 3px 0;
}
.editor-note strong{ color: var(--ink); }

/* ---------------- terms ---------------- */
.clause{ margin-bottom: 34px; }
.clause h2{ display:flex; align-items:baseline; gap: 10px; }
.clause .concept{ font-family: var(--font-mono); font-size: 1.15rem; font-weight: 600; text-transform:uppercase; letter-spacing:.03em; color: var(--blue); background: var(--blue-soft); padding: 6px 12px; border-radius: 3px; }

var GLOSSARY = [
  { term: "Comparative advantage", def: "Being relatively better at producing one thing than another — gains from trade come from this, not from being the best at everything." },
  { term: "Opportunity cost", def: "The value of the next-best thing you gave up to do what you chose instead." },
  { term: "Tariff", def: "A charge deducted from a sale when a good crosses a border — someone pays it, but not always who you’d expect." },
  { term: "Subsidy", def: "A payment added to a sale, usually to make a country’s own producers more competitive." },
  { term: "Quota", def: "A cap on how much of something can be sold at the normal price before a worse rate kicks in." },

var HO_ROUNDS = [

/* LIVE. Computed from TOPICS/GAMES — nothing to hand-edit when a topic
   or game is added.

   Real tube-map geometry, not trig-fan geometry: one horizontal row per
   topic, evenly stacked and vertically centred on the hub. Each row’s
   line leaves the hub as a 45° diagonal (the standard octolinear tube-map
   bend) until it reaches its row, then runs dead straight through the
   topic station and on through its game(s) — same idea as a real
   Underground line forking at an interchange and running parallel
   afterwards. Fixed row height, not an angle, is what guarantees two
   topics can never collide: their labels live in different horizontal
   lanes no matter how many topics exist. Every label also carries a
   paper-coloured halo (paint-order="stroke") so even a line crossing
   behind a label (which does happen where an outer row’s diagonal
   passes an inner row, exactly as two real tube lines cross without an
   interchange) never reads as cutting through the text.

   Scaling note: this trades an angle problem for a height problem — at
   very high topic counts the map gets tall rather than cluttered, which
   is the safer failure mode but not free forever. If it ever starts
   feeling too tall/scrolly, the fix is two hubs side by side (odd rows
   off one, even rows off the other) rather than shrinking row height. */
var MAP_LINE_COLORS = ["blue-line","rise-line","violet-line","chalk-line","stamp-line"];

/* The same coin + rising-line mark used in the hero illustration, reused
   as every card’s little icon badge — one recurring brand mark, in one
   uniform colour (set on .card-icon in CSS) for every card. */
function cardIconMark(){
  return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + '<circle cx="6.5" cy="6.5" r="2.4" fill="#fff" stroke="none"/>'
    + '<path d="M4 17 L9.5 11.5 L13 14.5 L20 7"/>'
    + '</svg>';
}

/* Measures real rendered text width via an offscreen canvas, so the map’s
   viewBox can be cropped tight to its actual content instead of reserving
   a fixed, mostly-empty canvas (which read as an unfinished/buggy page
   when there were only one or two nodes on it). */
function mapTextWidth(str, font){
  mapTextWidth._ctx = mapTextWidth._ctx || document.createElement("canvas").getContext("2d");
  mapTextWidth._ctx.font = font;
  return mapTextWidth._ctx.measureText(str).width;
}

function subwayMap(){
  if(!TOPICS.length){
    return '<div class="empty-state">No lines laid yet — the map will fill in as topics and games are added.</div>';
  }

  var hubX = 40, hubY = 0;
  var n = TOPICS.length;
  var rowGap = 108;     // vertical distance between two topics' lines — fixed, not angular, so it can’t shrink as topics are added
  var bendMargin = 46;  // horizontal run after the 45° bend, before the topic station
  var nodeGap = 46;     // clearance between one label’s end and the next station on the same row
  var labelFont = "600 14px 'IBM Plex Sans', sans-serif";
  var labelDX = 14, labelDY = -16; // every label sits above its row’s line, just right of its station — same rule everywhere, no above/below branching

  var lines = '', nodes = '';
  var minX = hubX - 15, maxX = hubX + 15, minY = hubY - 15, maxY = hubY + 15;
  function grow(x0, x1, y0, y1){
    minX = Math.min(minX, x0); maxX = Math.max(maxX, x1);
    minY = Math.min(minY, y0); maxY = Math.max(maxY, y1);
  }
  function haloText(x, y, str, anchor){
    return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="14" font-weight="600" text-anchor="'+anchor+'" '
      + 'stroke="var(--paper)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">'+esc(str)+'</text>';
  }

  TOPICS.forEach(function(t, i){
    var color = MAP_LINE_COLORS[i % MAP_LINE_COLORS.length];
    var rowY = (i - (n-1)/2) * rowGap;
    var bendX = hubX + Math.abs(rowY);
    var topicX = bendX + bendMargin;
    var pathD = 'M'+hubX.toFixed(1)+' '+hubY.toFixed(1)+' L'+bendX.toFixed(1)+' '+rowY.toFixed(1)+' L'+topicX.toFixed(1)+' '+rowY.toFixed(1);

    var labelW = mapTextWidth(t.title, labelFont);
    nodes += '<a href="#/topics"><circle class="station" cx="'+topicX.toFixed(1)+'" cy="'+rowY.toFixed(1)+'" r="11" fill="var(--panel)" stroke="var(--'+color+')" stroke-width="5"/>'
      + haloText(topicX+labelDX, rowY+labelDY, t.title, "start")
      + '</a>';
    grow(bendX, topicX + labelDX + labelW, rowY + labelDY - 15, rowY + 16);

    var cursorX = topicX + labelDX + labelW;
    (t.games || []).forEach(function(gid){
      var g = GAMES[gid];
      if(!g) return;
      var gx = cursorX + nodeGap;
      pathD += ' L'+gx.toFixed(1)+' '+rowY.toFixed(1);
      var gLabelW = mapTextWidth(g.title, labelFont);
      nodes += '<a href="#/games/'+gid+'"><circle class="station" cx="'+gx.toFixed(1)+'" cy="'+rowY.toFixed(1)+'" r="16" fill="var(--'+color+')" stroke="var(--panel)" stroke-width="4"/>'
        + haloText(gx+labelDX+6, rowY+labelDY, g.title, "start")
        + '</a>';
      grow(gx - 16, gx + labelDX + 6 + gLabelW, rowY + labelDY - 15, rowY + 16);
      cursorX = gx + labelDX + 6 + gLabelW;
    });

    lines += '<path class="map-line" d="'+pathD+'" fill="none" stroke="var(--'+color+')" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>';
  });

  var hub = '<a href="#/topics"><circle cx="'+hubX+'" cy="'+hubY.toFixed(1)+'" r="15" fill="var(--ink)" stroke="var(--panel)" stroke-width="4"/></a>';

  var pad = 20;
  var vbX = (minX - pad).toFixed(1), vbY = (minY - pad).toFixed(1);
  var vbW = (maxX - minX + pad*2).toFixed(1), vbH = (maxY - minY + pad*2).toFixed(1);

  return '<figure class="subway-fig reveal-map">'
    + '<svg viewBox="'+vbX+' '+vbY+' '+vbW+' '+vbH+'" role="img" aria-label="Subway-style map: a central hub with one line per topic, each running on through its game or games.">'
    + lines + nodes + hub
    + '</svg>'
    + '<div class="map-legend">'
    +   '<span><span class="dot" style="background:var(--ink)"></span>Hub — every topic</span>'
    +   '<span><span class="dot" style="background:var(--panel);border:2px solid var(--ink-faint)"></span>Topic</span>'
    +   '<span><span class="dot" style="background:var(--ink-faint)"></span>Game</span>'
    + '</div>'
    + '<figcaption>Every topic branches off one hub, then runs on to its game or games. Click any station to open it.</figcaption>'
    + '</figure>';
}

/* Renders a row of buttons that swap the panel below — used for the round
   selector (Round Cards / Session Guide / Debrief Guide) and the category
   selector (Trade Game debrief). Pass syncAttr="round" to keep the same
   round selected across all three Lake resource pages. */
function tabsHtml(groupKey, items, keyFn, labelFn, panelFn, activeKey, syncAttr){
  var buttons = items.map(function(it){

    return '<button type="button" class="tab-btn'+(k===String(activeKey)?' active':'')+'" data-tab="'+esc(k)+'">'+esc(labelFn(it))+'</button>';
  }).join('');
  var panels = items.map(function(it){
    var k = String(keyFn(it));
    return '<div class="tab-panel" data-tab="'+esc(k)+'"'+(k===String(activeKey)?'':' hidden')+'>'+panelFn(it)+'</div>';
  }).join('');
  return '<div class="tabs" data-group="'+groupKey+'"'+(syncAttr?' data-sync="'+syncAttr+'"':'')+'>'
    + '<div class="tab-buttons">'+buttons+'</div>'
    + '<div class="tab-panels">'+panels+'</div>'

}

/* A small fanned "hand of cards," one per line colour on the map — each
   card carries a coin dot and a rising ledger-line, so the illustration

   The fan angle is a real SVG transform (rotate around a shared pivot);

var HERO_CARD_SOFT_VAR = { blue:"--blue-soft", rise:"--rise-bg", violet:"--violet-bg", chalk:"--chalk-bg", stamp:"--stamp-bg" };
function heroArtSvg(){

      +   '<circle cx="136" cy="140" r="7" fill="var(--'+c+')"/>'
      +   '<path d="M126 210 L140 190 L152 200 L166 172" fill="none" stroke="var(--'+c+')" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
      + '</g></g>';
  }).join("");
  return '<svg class="hero-art" viewBox="0 0 320 260" role="img" aria-label="Five colourful cards fanned out, one per topic line on the dashboard map below.">'
    + cards
    + '</svg>';
}

function wireQuiz(){
  var form = document.getElementById("quiz-form");
  if(!form) return;
  var scoreBox = document.getElementById("quiz-score");
  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    var qDivs = form.querySelectorAll(".quiz-q");
    var score = 0;
    qDivs.forEach(function(div){
      var correct = parseInt(div.getAttribute("data-correct"), 10);
      var checked = div.querySelector("input:checked");
      var chosen = checked ? parseInt(checked.value, 10) : -1;
      var right = chosen === correct;
      if(right) score++;
      div.classList.remove("graded","correct","wrong");
      div.classList.add("graded", right ? "correct" : "wrong");
      div.querySelectorAll(".quiz-opt").forEach(function(lab, i){
        lab.classList.toggle("opt-correct", i === correct);
      });
    });
    scoreBox.innerHTML = '<span class="big">'+score+' / '+qDivs.length+'</span><p style="margin:8px 0 0">'+(
      score === qDivs.length ? "Perfect — you were paying attention while playing, not just while it was happening around you." :
      score >= qDivs.length*0.7 ? "Solid. Re-read the explanations on the ones you missed — they’re the debrief in miniature." :
      "Worth revisiting the debrief note before retaking this — the explanations below are the fastest way back in."
    )+'</p>';
    scoreBox.classList.add("show");
    scoreBox.scrollIntoView({behavior:"smooth", block:"start"});
  });
  document.getElementById("quiz-reset").addEventListener("click", function(){
    form.reset();
    form.querySelectorAll(".quiz-q").forEach(function(div){ div.classList.remove("graded","correct","wrong"); });
    scoreBox.classList.remove("show");
    window.scrollTo({top:0, behavior:"smooth"});
  });
}

    + accordionHtml([
      { title: "What you actually did", open: true, html:

        + '<div class="at-a-glance">' + LAKE_ROUNDS.map(function(r){

        + '<div class="worked-box">Every member faced that same arithmetic, and every one of them could reason it through correctly and still end with a lake nobody wanted. <strong>The trouble is in the structure, not the people.</strong></div>'
        + "<p>That uncounted seven-eighths has a name: an <strong>external cost</strong> — the same idea as smoke from a factory chimney, cheap to the factory because most of its cost is somebody else’s problem.</p>"
      },
      { title: "What kind of thing the lake was", html:
        "<p>Goods differ along two dimensions, and the lake sat in the awkward corner: rival (your fish is not mine) but impossible to exclude anyone from. That combination is a <strong>common-pool resource</strong> — not the same as a public good, where one person’s use costs nobody else anything.</p>"
      },
      { title: "The three repairs you tried", html:
        accordionHtml([
          { title: "Round 3 · a rule with an inspector", html: "<p>A seventh fish earned ₹30 and cost ₹120 if caught, half the time — an expected cost of ₹60 to earn ₹30. Anyone who went over made a bet they were expected to lose; some won it anyway. A good decision and a good outcome are not the same thing. The unseen cost: somebody has to pay the inspector.</p>" },
          { title: "Round 4 · a price on the damage", html: "<p>Every fish above six cost ₹80 to earn ₹40 — no inspectors, no luck. Private calculation and the lake’s interest gave the same answer. This is a <strong>Pigouvian tax</strong>: it does not punish fishing, it makes the fisher count a cost the lake was already paying. It needs no inspector, but does need someone who knows the right number.</p>" },
          { title: "Round 5 · an owner", html: "<p>The fish you left were still yours next spring, so restraint stopped being charity and became arithmetic — six now and eighteen next year (₹1,200) beat emptying it at once (₹900). Patience only pays the patient when the asset is theirs. The limit: try dividing the air over a city, or an aquifer under a village.</p>" }
        ])

      { title: "Why there were two winners", html:
        "<p>One prize rewarded the individual who earned the most; the other, the group with the largest <strong>lake account</strong> — what it earned, plus what the water was still worth. They almost never go to the same table, and that is not a flaw in the scoring.</p>"

      },
      { title: "Six things to take away", html:
        "<ol><li>A cost that falls on somebody else is not counted — an external cost, and why the catch, the smoke and the traffic are all larger than anybody wants.</li>"
        + "<li>Sensible people can produce a result none of them wanted. Look at the structure before you blame the people.</li>"
        + "<li>Agreements without enforcement decay — the member who quietly defects while everyone else cooperates does best of all.</li>"
        + "<li>A rule does not have to catch everybody; it has to make the expected penalty larger than the prize.</li>"
        + "<li>A price can do what a ban could not, by making the private calculation and the collective interest agree.</li>"
        + "<li>Self-interest produces good outcomes when the person deciding bears the full cost of deciding — a claim about an arrangement, not a law of nature.</li></ol>"

function wireContactForm(){
  var form = document.getElementById("contact-form");
  if(!form) return;
  var statusBox = document.getElementById("contact-status");
  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    var data = new FormData(form);
    var submitBtn = form.querySelector('button[type="submit"]');

    if(!CONTACT_FORM_URL){
      var params = new URLSearchParams({
        subject: "Message from " + (data.get("name") || "the website"),
        body: data.get("message") + "\n\n— " + data.get("name") + " (" + data.get("email") + ")"
      });
      window.location.href = "mailto:econarcade@gmail.com?" + params.toString();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";
    fetch(CONTACT_FORM_URL, { method: "POST", mode: "no-cors", body: data })
      .then(function(){
        form.hidden = true;
        statusBox.innerHTML = '<div class="editor-note"><strong>Sent.</strong> Thanks — the message is on its way, and a reply will come by email.</div>';
      })
      .catch(function(){
        submitBtn.disabled = false;
        submitBtn.textContent = "Send message";
        statusBox.innerHTML = '<div class="editor-note"><strong>That did not go through.</strong> Please try again, or write directly to <a href="mailto:econarcade@gmail.com">econarcade@gmail.com</a>.</div>';
      });
  });
}

/* ============================================================
   ANIMATION — scroll-reveal, count-up stats, and the map’s lines
   drawing themselves in. All three are re-armed after every route()
   render, since the DOM they act on is thrown away and rebuilt on
   every hash change. Every one of them no-ops instantly under
   prefers-reduced-motion instead of animating anyway. */
var PREFERS_REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function wireReveal(){
  var els = document.querySelectorAll(".reveal:not(.in)");
  if(PREFERS_REDUCED_MOTION || !("IntersectionObserver" in window)){
    els.forEach(function(el){ el.classList.add("in"); });
    return;
  }
  // Cards in the same .grid stagger by their position in it, so a row of
  // game/topic cards cascades in left-to-right instead of popping at once.
  var seenGrids = new WeakMap();
  els.forEach(function(el){
    var grid = el.closest(".grid");
    if(grid){
      var i = seenGrids.get(grid) || 0;
      el.style.transitionDelay = Math.min(i, 8) * 60 + "ms";
      seenGrids.set(grid, i + 1);
    }
  });
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add("in");
        io.unobserve(entry.target);
      }
    });
  }, { threshold: .12, rootMargin: "0px 0px -40px 0px" });
  els.forEach(function(el){ io.observe(el); });
}

function wireCounters(){
  var els = document.querySelectorAll("[data-count]:not([data-counted])");
  if(!els.length) return;
  function run(el){
    el.setAttribute("data-counted", "1");
    var target = parseInt(el.getAttribute("data-count"), 10) || 0;
    if(PREFERS_REDUCED_MOTION || !target){ el.textContent = target; return; }
    var start = null, duration = 900;
    function step(ts){
      if(start === null) start = ts;
      var p = Math.min(1, (ts - start) / duration);
      var eased = 1 - Math.pow(1 - p, 3); // ease-out-cubic
      el.textContent = Math.round(eased * target);
      if(p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  if(!("IntersectionObserver" in window)){ els.forEach(run); return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){ run(entry.target); io.unobserve(entry.target); }
    });
  }, { threshold: .4 });
  els.forEach(function(el){ io.observe(el); });
}

function wireMapDrawIn(){
  var fig = document.querySelector(".reveal-map:not([data-drawn])");
  if(!fig) return;
  var paths = fig.querySelectorAll(".map-line");
  if(!paths.length) return;
  if(PREFERS_REDUCED_MOTION){ fig.setAttribute("data-drawn", "1"); return; }
  function draw(){
    fig.setAttribute("data-drawn", "1");
    paths.forEach(function(p, i){
      var len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      p.style.transition = "none";
      // Two rAFs: the first lets the browser paint the "fully hidden" state,
      // the second then flips to 0 so the transition actually has something
      // to animate from — setting both in the same frame just skips to the end.
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          p.style.transition = "stroke-dashoffset 1s ease " + (i * 90) + "ms";
          p.style.strokeDashoffset = 0;
        });
      });
    });
  }
  if(!("IntersectionObserver" in window)){ draw(); return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){ draw(); io.unobserve(entry.target); }
    });
  }, { threshold: .3 });
  io.observe(fig);
}

function renderTicker(){
  var el = document.getElementById("ticker");
  var items = TICKER_ITEMS.concat(TICKER_ITEMS); // doubled for seamless loop
  el.innerHTML = items.map(function(t){
    var parts = t.split(/—/);
    if(parts.length > 1){
      return '<span><b>'+esc(parts[0].trim())+'</b> — '+esc(parts.slice(1).join("—").trim())+'</span>';
    }
    return '<span>'+esc(t)+'</span>';
  }).join("");
}

function setActiveNav(topRoute){
  document.querySelectorAll('#site-nav a').forEach(function(a){
    a.classList.toggle('active', a.getAttribute('data-route') === topRoute);
  });
}

function route(){
  var hash = location.hash.replace(/^#\/?/, "").replace(/\/$/, "");
  var parts = hash ? hash.split("/") : [];
  var app = document.getElementById("app");
  var html = "";
  var top = parts[0] || "";

  if(parts.length === 0){
    html = renderHome();
  } else if(parts[0] === "games" && parts.length === 1){
    html = renderGames();
  } else if(parts[0] === "topics"){
    html = renderTopics();
  } else if(parts[0] === "about"){
    html = renderAbout();
  } else if(parts[0] === "terms"){
    html = renderTerms();
  } else if(parts[0] === "contact"){
    html = renderContact();
  } else if(parts[0] === "games" && parts.length === 2){
    html = renderGameOverview(parts[1]);
  } else if(parts[0] === "games" && parts.length === 3){
    var pages = RESOURCE_PAGES[parts[1]];
    html = (pages && pages[parts[2]]) ? pages[parts[2]](parts[1]) : renderNotFound();
  } else {
    html = renderNotFound();
  }

  app.innerHTML = html;
  setActiveNav(top);
  var todayEl = document.getElementById("today");
  if(todayEl) todayEl.textContent = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  wireQuiz();
  wireContactForm();
  wireReveal();
  wireCounters();
  wireMapDrawIn();
  window.scrollTo({top:0, behavior:"instant"});
  // Restart the CSS fade-in on the new content — resetting to "none" and
  // reading a layout property forces the browser to notice the animation
  // changed, since re-applying the same class/style wouldn’t restart it.
  app.style.animation = "none";
  app.offsetHeight;
  app.style.animation = "";
}

/* One delegated listener for every accordion header and tab button on the
   site — works across route changes since it’s bound to document, not to
   elements that get replaced on every render. */
document.addEventListener("click", function(e){
  var tabBtn = e.target.closest(".tab-btn");
  if(tabBtn){
    var wrap = tabBtn.closest(".tabs");
    var key = tabBtn.getAttribute("data-tab");
    wrap.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.toggle("active", b === tabBtn); });
    wrap.querySelectorAll(".tab-panel").forEach(function(p){ p.hidden = (p.getAttribute("data-tab") !== key); });
    if(wrap.getAttribute("data-sync") === "round"){ activeRound = parseInt(key, 10); }
    return;
  }
  var accHead = e.target.closest(".accordion-header");
  if(accHead){
    var item = accHead.closest(".accordion-item");
    var willOpen = !item.classList.contains("open");
    item.classList.toggle("open", willOpen);
    accHead.setAttribute("aria-expanded", String(willOpen));
    item.querySelector(".accordion-panel").hidden = !willOpen;
    return;
  }
});

renderTicker();
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);
route();
