<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinking Like an Economist</title>
<meta name="description" content="Classroom games for teaching economics by discovery, by Rupa Korde.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ============================================================
   THINKING LIKE AN ECONOMIST — design tokens
   Ledger/exchange-board world: ruled paper, posted prices, a
   transit map of how topics connect. Blue as the house colour,
   chalk-amber as the one quirky accent, used sparingly.
   ============================================================ */
:root{
  --paper:      #F2F5FC;
  --paper-2:    #E6EBF8;
  --panel:      #FFFFFF;
  --ink:        #101A30;
  --ink-soft:   #4B5A7A;
  --ink-faint:  #7C8AAC;
  --rule:       #C7D2EC;
  --rule-strong:#9DAEDA;

  --blue:       #2951D8;
  --blue-deep:  #142A61;
  --blue-soft:  #DDE6FC;
  --blue-line:  #2951D8;

  --chalk:      #92650F;
  --chalk-bg:   #F3E3C4;
  --chalk-line: #C6890F;

  --rise:       #1E7A5A;
  --rise-bg:    #DCEFE6;
  --rise-line:  #1E9A6E;

  --stamp:      #A8322A;
  --stamp-bg:   #F5E1DE;
  --stamp-line: #B23A31;

  --violet:     #5B3FA0;
  --violet-bg:  #E7E0F5;
  --violet-line:#6B48BF;

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --max: 1040px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:      #0A0F1E;
    --paper-2:    #101830;
    --panel:      #121A33;
    --ink:        #E9EDF9;
    --ink-soft:   #A9B6D6;
    --ink-faint:  #7686AC;
    --rule:       #26315A;
    --rule-strong:#37448A;

    --blue:       #7E9CFF;
    --blue-deep:  #C4D2FF;
    --blue-soft:  #1B2650;

    --chalk:      #E3B15C;
    --chalk-bg:   #362A12;
    --chalk-line: #C88E2F;

    --rise:       #4FCB9C;
    --rise-bg:    #10291F;
    --rise-line:  #3FBE93;

    --stamp:      #E58177;
    --stamp-bg:   #331714;
    --stamp-line: #C24A40;

    --violet:     #B29CE8;
    --violet-bg:  #241A3E;
    --violet-line:#8A6BD1;
  }
}
:root[data-theme="dark"]{
  --paper:      #0A0F1E;
  --paper-2:    #101830;
  --panel:      #121A33;
  --ink:        #E9EDF9;
  --ink-soft:   #A9B6D6;
  --ink-faint:  #7686AC;
  --rule:       #26315A;
  --rule-strong:#37448A;

  --blue:       #7E9CFF;
  --blue-deep:  #C4D2FF;
  --blue-soft:  #1B2650;

  --chalk:      #E3B15C;
  --chalk-bg:   #362A12;
  --chalk-line: #C88E2F;

  --rise:       #4FCB9C;
  --rise-bg:    #10291F;
  --rise-line:  #3FBE93;

  --stamp:      #E58177;
  --stamp-bg:   #331714;
  --stamp-line: #C24A40;

  --violet:     #B29CE8;
  --violet-bg:  #241A3E;
  --violet-line:#8A6BD1;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
img{ max-width:100%; display:block; }
a{ color: var(--blue); text-decoration: none; }
a:hover{ text-decoration: underline; }
:focus-visible{ outline: 2px solid var(--blue); outline-offset: 2px; }

h1,h2,h3,h4{
  font-family: var(--font-display);
  color: var(--ink);
  line-height: 1.15;
  margin: 0 0 .5em;
  text-wrap: balance;
  font-weight: 600;
}
h1{ font-size: clamp(2.1rem, 4.4vw, 3.2rem); }
h2{ font-size: clamp(1.5rem, 2.6vw, 1.9rem); }
h3{ font-size: 1.25rem; }
p{ margin: 0 0 1em; max-width: 65ch; }
.prose p, .prose li{ max-width: 68ch; }

.container{ max-width: var(--max); margin: 0 auto; padding: 0 24px; }
.eyebrow{
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: .1em;
  font-size: .74rem;
  color: var(--blue);
}
.mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------------- header + ticker ---------------- */
.site-header{
  position: sticky; top:0; z-index: 30;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.ticker-wrap{
  background: var(--blue-deep);
  color: #fff;
  overflow: hidden;
  white-space: nowrap;
  border-bottom: 1px solid var(--rule-strong);
}
.ticker{
  display:inline-flex;
  gap: 48px;
  padding: 6px 0;
  animation: ticker-scroll 42s linear infinite;
  font-family: var(--font-mono);
  font-size: .78rem;
  letter-spacing: .03em;
}
.ticker span{ opacity:.92; }
.ticker span b{ color: #FFD98A; font-weight:600; }
@keyframes ticker-scroll{
  from{ transform: translateX(0); }
  to{ transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce){
  .ticker{ animation: none; }
}

.nav-row{
  display:flex; align-items:center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding: 16px 0;
}
.brand{
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.25rem;
  color: var(--ink);
  display:flex; flex-direction:column; line-height:1.1;
}
.brand small{
  font-family: var(--font-mono);
  font-size: .62rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 500;
}
.site-nav{ display:flex; gap: 22px; flex-wrap: wrap; }
.site-nav a{
  color: var(--ink); font-weight: 600; font-size: .93rem;
  padding: 4px 0; border-bottom: 2px solid transparent;
}
.site-nav a:hover{ text-decoration:none; border-bottom-color: var(--rule-strong); }
.site-nav a.active{ border-bottom-color: var(--blue); color: var(--blue); }

/* ---------------- buttons / tags / stamp ---------------- */
.btn{
  display:inline-flex; align-items:center; gap:.4em;
  font-family: var(--font-body); font-weight: 700; font-size: .95rem;
  padding: 12px 20px; border-radius: 3px;
  border: 1px solid var(--blue); background: var(--blue); color: #fff !important;
  cursor:pointer; text-decoration:none !important;
}
.btn:hover{ background: var(--blue-deep); border-color: var(--blue-deep); }
.btn.ghost{ background: transparent; color: var(--blue) !important; }
.btn.ghost:hover{ background: var(--blue-soft); }
.btn.disabled{ opacity:.55; cursor:not-allowed; pointer-events:none; background: var(--ink-faint); border-color: var(--ink-faint); }

.tag{
  font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase;
  letter-spacing: .05em; padding: 3px 9px; border-radius: 2px;
  background: var(--blue-soft); color: var(--blue);
  display:inline-block;
}
.tag.live{ background: var(--rise-bg); color: var(--rise); }
.tag.chalk{ background: var(--chalk-bg); color: var(--chalk); }
.tag.stamp{ background: var(--stamp-bg); color: var(--stamp); }
.tag.violet{ background: var(--violet-bg); color: var(--violet); }

.stamp-badge{
  display:inline-block;
  font-family: var(--font-mono);
  font-size: .68rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--stamp);
  border: 1.5px solid var(--stamp);
  padding: 5px 10px;
  border-radius: 2px;
  transform: rotate(-3deg);
  background: var(--stamp-bg);
}

/* ---------------- hero / ledger spread ---------------- */
.hero{ padding: 56px 0 40px; border-bottom: 1px solid var(--rule); }
.ledger-spread{
  display:grid; grid-template-columns: 1.3fr .9fr; gap: 40px; align-items: start;
}
@media (max-width: 760px){ .ledger-spread{ grid-template-columns: 1fr; } }
.hero p.lead{ font-size: 1.13rem; color: var(--ink-soft); max-width: 46ch; }
.hero-actions{ display:flex; gap: 14px; margin-top: 22px; flex-wrap: wrap; }

.index-card{
  background: var(--panel);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--blue);
  border-radius: 3px;
  padding: 22px 24px;
}
.index-card h4{
  font-family: var(--font-mono); font-size: .72rem; letter-spacing:.1em;
  text-transform: uppercase; color: var(--ink-faint); margin: 0 0 14px;
}
.stat-row{
  display:flex; justify-content: space-between; align-items: baseline;
  padding: 8px 0; border-bottom: 1px dashed var(--rule);
  font-size: .92rem;
}
.stat-row:last-child{ border-bottom:none; }
.stat-row .n{ font-family: var(--font-mono); font-weight:600; color: var(--blue); font-size: 1rem; }

/* ---------------- sections ---------------- */
section{ padding: 56px 0; }
section.alt{ background: var(--paper-2); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.section-head{ max-width: 620px; margin-bottom: 30px; }
.section-head p{ color: var(--ink-soft); }

.grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 22px; }
.card{
  background: var(--panel); border: 1px solid var(--rule); border-radius: 4px;
  padding: 24px; display:flex; flex-direction:column;
}
.card h3{ margin-bottom: .3em; }
.card .muted{ color: var(--ink-soft); font-size: .93rem; }
.card .tags{ margin: 10px 0 14px; display:flex; gap:8px; flex-wrap:wrap; }
.card .spacer{ flex:1; }

/* ---------------- subway map ---------------- */
.map-legend{ display:flex; gap: 18px; flex-wrap: wrap; margin-top: 18px; font-size: .85rem; color: var(--ink-soft); }
.map-legend .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align: -1px; }
.subway-fig{ margin: 0; }
.subway-fig svg{ width:100%; height:auto; display:block; }
.subway-fig figcaption{ margin-top: 14px; color: var(--ink-soft); font-size: .88rem; }
.subway-fig a text{ fill: var(--ink); font-family: var(--font-body); }
.subway-fig a:hover text{ fill: var(--blue); }
.subway-fig a:hover circle.station{ stroke-width: 4; }

/* ---------------- game overview / notes ---------------- */
.game-head{ display:flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items:flex-start; margin-bottom: 8px; }
.subnav{
  display:flex; gap: 6px; flex-wrap: wrap; margin: 22px 0 34px;
  border-bottom: 1px solid var(--rule); padding-bottom: 2px;
}
.subnav a{
  font-family: var(--font-mono); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--ink-soft); padding: 8px 12px; border-bottom: 2px solid transparent;
}
.subnav a:hover{ text-decoration:none; color: var(--ink); }
.subnav a.active{ color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }

.ledger-note{
  border-left: 3px solid var(--rule-strong);
  padding-left: 22px;
  position: relative;
}
.ledger-note::before{
  content:"";
  position:absolute; left:-1px; top:0; bottom:0; width:1px;
  background: repeating-linear-gradient(to bottom, var(--rule-strong) 0 6px, transparent 6px 12px);
  display:none;
}
.at-a-glance{
  display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 16px; margin: 20px 0 30px;
}
.at-a-glance .item{
  background: var(--paper-2); border: 1px solid var(--rule); border-radius: 3px;
  padding: 12px 14px;
}
.at-a-glance .item .k{ font-family: var(--font-mono); font-size: .68rem; text-transform:uppercase; letter-spacing:.08em; color: var(--ink-faint); }
.at-a-glance .item .v{ font-size: .95rem; margin-top: 3px; }

.category-block{
  border: 1px solid var(--rule); border-radius: 4px; padding: 20px 22px; margin-bottom: 18px;
  background: var(--panel);
}
.category-block h4{ font-family: var(--font-display); font-size: 1.08rem; margin: 0 0 6px; }
.category-block .count{ font-family: var(--font-mono); font-size: .78rem; color: var(--ink-faint); }
.condition-example{
  border-top: 1px dashed var(--rule); margin-top: 12px; padding-top: 12px;
}
.condition-example .title{ font-weight: 600; font-size: .95rem; }
.condition-example .debrief{ color: var(--blue); font-size: .85rem; font-family: var(--font-mono); }
.discussion-q{
  margin-top: 12px; padding: 10px 14px; background: var(--chalk-bg); border-radius: 3px;
  font-size: .9rem; color: var(--chalk);
}

.glossary dt{ font-weight: 700; font-family: var(--font-display); font-size: 1.02rem; margin-top: 16px; }
.glossary dd{ margin: 4px 0 0; color: var(--ink-soft); }

/* ---------------- quiz ---------------- */
.quiz-progress{
  font-family: var(--font-mono); font-size: .85rem; color: var(--ink-soft); margin-bottom: 18px;
}
.quiz-q{
  border: 1px solid var(--rule); border-radius: 4px; padding: 18px 20px; margin-bottom: 16px; background: var(--panel);
}
.quiz-q .qn{ font-family: var(--font-mono); font-size: .74rem; color: var(--ink-faint); }
.quiz-q .qtext{ font-weight: 600; margin: 6px 0 12px; }
.quiz-opt{ display:flex; align-items:flex-start; gap: 10px; padding: 8px 0; cursor:pointer; font-size: .95rem; }
.quiz-opt input{ margin-top: 4px; accent-color: var(--blue); }
.quiz-q.graded.correct{ border-color: var(--rise-line); }
.quiz-q.graded.wrong{ border-color: var(--stamp-line); }
.quiz-explain{ display:none; margin-top: 10px; padding: 10px 12px; border-radius: 3px; font-size: .88rem; }
.quiz-q.graded .quiz-explain{ display:block; }
.quiz-q.graded.correct .quiz-explain{ background: var(--rise-bg); color: var(--rise); }
.quiz-q.graded.wrong .quiz-explain{ background: var(--stamp-bg); color: var(--stamp); }
.quiz-opt.opt-correct{ font-weight:700; }
.quiz-score{
  border: 2px solid var(--blue); border-radius: 4px; padding: 20px 24px; margin-bottom: 24px;
  background: var(--blue-soft);
  display:none;
}
.quiz-score.show{ display:block; }
.quiz-score .big{ font-family: var(--font-mono); font-size: 2rem; color: var(--blue); font-weight:600; }

/* ---------------- about ---------------- */
.about-layout{ display:grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: start; }
@media (max-width: 640px){ .about-layout{ grid-template-columns: 1fr; } }
.portrait{
  width: 100%; aspect-ratio: 1; border-radius: 4px; border: 1px solid var(--rule);
  background: var(--paper-2); display:flex; align-items:center; justify-content:center;
  color: var(--ink-faint); font-family: var(--font-mono); font-size: .78rem; text-align:center; padding: 16px;
  overflow:hidden;
}
.portrait img{ width:100%; height:100%; object-fit:cover; }

.editor-note{
  border-left: 3px solid var(--chalk-line); background: var(--chalk-bg); padding: 10px 14px;
  font-size: .87rem; color: var(--chalk); margin: 0 0 1.4em; border-radius: 0 3px 3px 0;
}
.editor-note strong{ color: var(--ink); }

/* ---------------- terms ---------------- */
.clause{ margin-bottom: 34px; }
.clause h2{ display:flex; align-items:baseline; gap: 10px; }
.clause .concept{ font-family: var(--font-mono); font-size: .68rem; text-transform:uppercase; letter-spacing:.08em; color: var(--blue); background: var(--blue-soft); padding: 3px 8px; border-radius: 2px; }

.empty-state{ border: 1px dashed var(--rule); border-radius: 4px; padding: 32px; text-align: center; color: var(--ink-soft); }

/* ---------------- accordions ---------------- */
.accordion{ border-top: 1px solid var(--rule); margin: 18px 0; }
.accordion-item{ border-bottom: 1px solid var(--rule); }
.accordion-header{
  width:100%; text-align:left; background:none; border:none; padding:16px 4px;
  font-family: var(--font-display); font-size: 1.08rem; font-weight:600; color: var(--ink);
  cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:14px;
}
.accordion-header:hover{ color: var(--blue); }
.accordion-item .chev{ transition: transform .15s ease; color: var(--ink-faint); font-size: 1.2rem; flex:none; }
.accordion-item.open .chev{ transform: rotate(180deg); }
.accordion-panel{ padding: 0 4px 22px; }
.accordion-panel h4{ font-family: var(--font-display); font-size: 1rem; margin: 16px 0 8px; }
.accordion-panel .accordion{ margin: 8px 0 0; }

/* ---------------- tabs (round selector / category selector) ---------------- */
.tabs{ margin: 18px 0 30px; }
.tab-buttons{ display:flex; flex-wrap:wrap; gap: 8px; margin-bottom: 20px; }
.tab-btn{
  font-family: var(--font-mono); font-size: .76rem; text-transform: uppercase; letter-spacing: .03em;
  padding: 9px 15px; border: 1px solid var(--rule); background: var(--panel); border-radius: 20px;
  cursor:pointer; color: var(--ink-soft);
}
.tab-btn:hover{ border-color: var(--rule-strong); color: var(--ink); }
.tab-btn.active{ background: var(--blue); color: #fff; border-color: var(--blue); }

.epigraph{
  font-family: var(--font-display); font-style: italic; font-size: 1.05rem; color: var(--ink-soft);
  border-left: 3px solid var(--rule-strong); padding-left: 16px; margin: 0 0 14px;
}
.price-badge{ font-family: var(--font-mono); font-size: .82rem; color: var(--blue); font-weight:600; margin: 0 0 12px; }
.worked-box{
  background: var(--paper-2); border: 1px solid var(--rule); border-radius: 4px;
  padding: 14px 18px; font-family: var(--font-mono); font-size: .84rem; line-height: 1.8; margin: 14px 0;
}
.prompt-box{ border: 1px dashed var(--rule-strong); border-radius: 4px; padding: 12px 16px; margin-top: 14px; background: var(--panel); }
.prompt-box .p-item{ font-size: .87rem; color: var(--ink-soft); margin-bottom: 6px; }
.prompt-box .p-item::before{ content: "✎  "; }

.qa-block{ margin-top: 14px; padding: 12px 16px; border-left: 3px solid var(--blue); background: var(--blue-soft); border-radius: 0 3px 3px 0; }
.qa-block .who{ font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--blue); margin-bottom: 4px; }
.qa-block ul{ margin: 4px 0; }
.qa-block .opens{ font-size: .82rem; color: var(--ink-soft); margin-top: 8px; }

/* ---------------- print: this site is not meant to be printed whole ---------------- */
@media print{
  body *{ visibility: hidden !important; }
  body::after{
    content: "Thinking Like an Economist is built to be read online, one section at a time — not printed as a single document. Visit the site to continue.";
    visibility: visible !important; position: fixed; top: 38%; left: 8%; right: 8%;
    font-family: system-ui, sans-serif; font-size: 20px; text-align: center; color: #000;
  }
}

/* ---------------- footer ---------------- */
.site-footer{ border-top: 1px solid var(--rule); padding: 30px 0; color: var(--ink-soft); font-size: .87rem; }
.site-footer .container{ display:flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.site-footer a{ color: var(--ink-soft); }

</style>
</head>
<body>

<header class="site-header">
  <div class="ticker-wrap">
    <div class="container">
      <div class="ticker" id="ticker"></div>
    </div>
  </div>
  <div class="container nav-row">
    <a class="brand" href="#/">Thinking Like an Economist<small>Games for teaching economics</small></a>
    <nav class="site-nav" id="site-nav">
      <a href="#/" data-route="">Home</a>
      <a href="#/topics" data-route="topics">Topics</a>
      <a href="#/games" data-route="games">Games</a>
      <a href="#/about" data-route="about">About</a>
      <a href="#/terms" data-route="terms">Terms of Use</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="site-footer">
  <div class="container">
    <span>&copy; <span id="year"></span> Rupa Korde — Thinking Like an Economist</span>
    <a href="#/terms">Terms of Use</a>
  </div>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

/* ============================================================
   DATA
   Add a new game: add an entry to GAMES, then a matching entry
   in TEACHING_NOTES / DEBRIEF_NOTES / STUDENT_NOTES / QUIZZES
   keyed by the same id. Add a new topic: add to TOPICS.
   ============================================================ */

var GAMES = {
  "trade-game": {
    id: "trade-game",
    title: "The International Trade Game",
    tagline: "A live classroom simulation of comparative advantage, tariffs, and trade policy.",
    description: "Students are split into six “countries” with unequal tools and starting cash, and must manufacture and trade paper shapes for profit while the instructor fires real-time conditions — tariffs, subsidies, embargoes, quotas, cartels — into the live market. Based on John Sloman’s International Trade Game (Economics Network, 2002).",
    course: "ECON102 · Thinking Like an Economist · FLAME University",
    format: "Live classroom · 45 minutes · phones + projector",
    status: "live",
    statusLabel: "Field-tested",
    tags: ["Comparative advantage", "Trade policy", "Classroom simulation"],
    link: null,
    linkLabel: "Launch — link coming soon",
    minutes: 45,
    glance: [
      { k: "Course", v: "ECON102 · Thinking Like an Economist · FLAME University" },

/* The Heckscher-Ohlin Trade Game — round-by-round reference used by its
   Debrief Note. Kept separate from LAKE_ROUNDS since this game’s other
   pages (Teaching Note, Student Note) don’t need a shared round selector. */
var HO_ROUNDS = [
  { n: 1, title: "Home production (autarky)",
    summary: "No trade. Each team picks one point on its own production-possibility frontier — that is exactly what it has to live on this round.",
    typical: "Teams that spread themselves across both goods score better than teams that fully specialise, since a pile of one good with none of the other is worth half as much under the matched-pair scoring. Nobody has been told there is a “right” country type yet.",
    meaning: "Labouria’s frontier runs from (0 Cloth, 10 Machinery) to (20 Cloth, 0 Machinery); Capitalia’s from (0, 20) to (10, 0). Same recipes everywhere — 1 Cloth = 2 Labour + 1 Capital, 1 Machinery = 1 Labour + 2 Capital — but Labouria’s scarce factor (Capital) always binds first, and Capitalia’s scarce factor (Labour) always binds first. That single difference is enough to give Cloth a home opportunity cost of 0.5 Machinery in Labouria and 2 Machinery in Capitalia — nobody set those numbers on purpose; they fall straight out of the endowments.",
    ask: "Ask a Labouria team and a Capitalia team, in turn: “what did one more unit of Cloth cost you, in Machinery you had to give up?” The gap between their two answers is the entire reason trade is about to be worth having."
  },
  { n: 2, title: "The border opens (trade)",
    summary: "A single world price is posted — 1 Machinery per Cloth, sitting between both blocs’ home prices. Teams re-pick production, then may trade with the other bloc at that price.",
    typical: "Most Labouria teams drift toward all-Cloth production and trade the surplus for Machinery; most Capitalia teams do the mirror move. Scores roughly double what the best mixed autarky bundle could reach.",
    meaning: "This is the Heckscher-Ohlin result, arrived at without the name being said: a bloc exports the good that uses its abundant factor intensively — labour-abundant Labouria exports the labour-intensive good (Cloth), capital-abundant Capitalia exports the capital-intensive good (Machinery) — and both are better off than they were producing a balanced bundle alone.",
    ask: "Ask the room to compare their best Round 1 score with their Round 2 score. Then ask: “did anyone get worse at making Cloth between the two rounds?” Nothing about ability changed — only the option to trade did."

    summary: "Each student is quietly handed a Labour or Capital token roughly matching their team’s mix. Trade’s gains are then paid out by token, not evenly across the team.",

/* ============================================================
   VISITOR LOG
   A tiny Google Apps Script + Sheet (see visit-counter-src/ in the repo)
   logs one row per page open and returns the running total — no cookie,
   no IP, no session dedup, on purpose: every open counts, including
   repeat opens from the same device. Paste the deployed web app URL
   below once it exists; until then the ledger just shows "…".
   ============================================================ */
var VISIT_LOG_URL = null; // e.g. "https://script.google.com/macros/s/XXXX/exec"
var visitorCount = null;

function logVisit(){
  if(!VISIT_LOG_URL) return;
  var path = location.hash || "#/";
  fetch(VISIT_LOG_URL + "?path=" + encodeURIComponent(path))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && typeof d.count === "number"){
        visitorCount = d.count;
        var el = document.getElementById("visitor-count");
        if(el) el.textContent = visitorCount.toLocaleString();
      }
    })
    .catch(function(){ /* a broken counter should never break the site */ });
}

/* Renders a titled, click-to-expand list. items: [{title, html, open}].
   Collapsed panels are a real `hidden` attribute, not just visually hidden —
   so printing the page only prints what is actually open on screen. */
function accordionHtml(items){
  return '<div class="accordion">' + items.map(function(it){
    var open = !!it.open;
    return '<div class="accordion-item'+(open?' open':'')+'">'
      + '<button type="button" class="accordion-header" aria-expanded="'+open+'">'+esc(it.title)+'<span class="chev">⌄</span></button>'
      + '<div class="accordion-panel"'+(open?'':' hidden')+'>'+it.html+'</div>'
      + '</div>';
  }).join('') + '</div>';
}

/* Renders a row of buttons that swap the panel below — used for the round
   selector (Round Cards / Session Guide / Debrief Guide) and the category
   selector (Trade Game debrief). Pass syncAttr="round" to keep the same
   round selected across all three Lake resource pages. */
function tabsHtml(groupKey, items, keyFn, labelFn, panelFn, activeKey, syncAttr){
  var buttons = items.map(function(it){
    var k = String(keyFn(it));
    return '<button type="button" class="tab-btn'+(k===String(activeKey)?' active':'')+'" data-tab="'+esc(k)+'">'+esc(labelFn(it))+'</button>';
  }).join('');
  var panels = items.map(function(it){
    var k = String(keyFn(it));
    return '<div class="tab-panel" data-tab="'+esc(k)+'"'+(k===String(activeKey)?'':' hidden')+'>'+panelFn(it)+'</div>';
  }).join('');
  return '<div class="tabs" data-group="'+groupKey+'"'+(syncAttr?' data-sync="'+syncAttr+'"':'')+'>'
    + '<div class="tab-buttons">'+buttons+'</div>'
    + '<div class="tab-panels">'+panels+'</div>'
    + '</div>';
}

function wireQuiz(){
  var form = document.getElementById("quiz-form");
  if(!form) return;
  var scoreBox = document.getElementById("quiz-score");
  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    var qDivs = form.querySelectorAll(".quiz-q");
    var score = 0;
    qDivs.forEach(function(div){
      var correct = parseInt(div.getAttribute("data-correct"), 10);
      var checked = div.querySelector("input:checked");
      var chosen = checked ? parseInt(checked.value, 10) : -1;
      var right = chosen === correct;
      if(right) score++;
      div.classList.remove("graded","correct","wrong");
      div.classList.add("graded", right ? "correct" : "wrong");
      div.querySelectorAll(".quiz-opt").forEach(function(lab, i){
        lab.classList.toggle("opt-correct", i === correct);
      });
    });
    scoreBox.innerHTML = '<span class="big">'+score+' / '+qDivs.length+'</span><p style="margin:8px 0 0">'+(
      score === qDivs.length ? "Perfect — you were paying attention while playing, not just while it was happening around you." :
      score >= qDivs.length*0.7 ? "Solid. Re-read the explanations on the ones you missed — they’re the debrief in miniature." :
      "Worth revisiting the debrief note before retaking this — the explanations below are the fastest way back in."
    )+'</p>';
    scoreBox.classList.add("show");
    scoreBox.scrollIntoView({behavior:"smooth", block:"start"});
  });
  document.getElementById("quiz-reset").addEventListener("click", function(){
    form.reset();
    form.querySelectorAll(".quiz-q").forEach(function(div){ div.classList.remove("graded","correct","wrong"); });
    scoreBox.classList.remove("show");
    window.scrollTo({top:0, behavior:"smooth"});
  });
}

/* ---- The Lake: Lessons Learned (student-facing, after play) ---- */
function renderLakeLessonsLearned(id){
  var g = GAMES[id];
  if(!g) return renderNotFound();
  return '<section class="hero" style="padding-bottom:0">' + pageChrome(''
    + '<span class="eyebrow">Lessons learned</span>'
    + '<h1>What the lake was about</h1>'
    + '<p class="lead">Read this after you have played, not before — it names things Round 1 depends on you discovering yourself.</p>'
    + subNav(id, "lessons-learned")
  ) + '</section>'
  + '<section style="padding-top:0">' + pageChrome(''
    + accordionHtml([
      { title: "What you actually did", open: true, html:
        "<p>Eight of you shared a lake of 144 fish for four rounds, then fished alone for one. The lake replaced 48 fish a round, so six each was the share that could be taken forever.</p>"
        + '<div class="at-a-glance">' + LAKE_ROUNDS.map(function(r){
            return '<div class="item"><div class="k">Round '+r.n+' · '+esc(r.price)+'</div><div class="v">'+esc(r.title)+'</div></div>';
          }).join('') + '</div>'
      },
      { title: "Why Round 1 went the way it did", html:
        "<p>An extra fish earned you ₹10 in full, immediately. It also thinned the lake for the next round — a cost split eight ways, arriving later. You captured the whole benefit and about one-eighth of the cost.</p>"
        + '<div class="worked-box">Every member faced that same arithmetic, and every one of them could reason it through correctly and still end with a lake nobody wanted. <strong>The trouble is in the structure, not the people.</strong></div>'
        + "<p>That uncounted seven-eighths has a name: an <strong>external cost</strong> — the same idea as smoke from a factory chimney, cheap to the factory because most of its cost is somebody else’s problem.</p>"
      },
      { title: "What kind of thing the lake was", html:
        "<p>Goods differ along two dimensions, and the lake sat in the awkward corner: rival (your fish is not mine) but impossible to exclude anyone from. That combination is a <strong>common-pool resource</strong> — not the same as a public good, where one person’s use costs nobody else anything.</p>"
      },
      { title: "The three repairs you tried", html:
        accordionHtml([
          { title: "Round 3 · a rule with an inspector", html: "<p>A seventh fish earned ₹30 and cost ₹120 if caught, half the time — an expected cost of ₹60 to earn ₹30. Anyone who went over made a bet they were expected to lose; some won it anyway. A good decision and a good outcome are not the same thing. The unseen cost: somebody has to pay the inspector.</p>" },
          { title: "Round 4 · a price on the damage", html: "<p>Every fish above six cost ₹80 to earn ₹40 — no inspectors, no luck. Private calculation and the lake’s interest gave the same answer. This is a <strong>Pigouvian tax</strong>: it does not punish fishing, it makes the fisher count a cost the lake was already paying. It needs no inspector, but does need someone who knows the right number.</p>" },
          { title: "Round 5 · an owner", html: "<p>The fish you left were still yours next spring, so restraint stopped being charity and became arithmetic — six now and eighteen next year (₹1,200) beat emptying it at once (₹900). Patience only pays the patient when the asset is theirs. The limit: try dividing the air over a city, or an aquifer under a village.</p>" }
        ])
      },
      { title: "Why there were two winners", html:
        "<p>One prize rewarded the individual who earned the most; the other, the group with the largest <strong>lake account</strong> — what it earned, plus what the water was still worth. They almost never go to the same table, and that is not a flaw in the scoring.</p>"
        + '<p class="muted">Which of the two numbers does GDP resemble? Session 25 returns to exactly that.</p>'
      },
      { title: "Six things to take away", html:
        "<ol><li>A cost that falls on somebody else is not counted — an external cost, and why the catch, the smoke and the traffic are all larger than anybody wants.</li>"
        + "<li>Sensible people can produce a result none of them wanted. Look at the structure before you blame the people.</li>"
        + "<li>Agreements without enforcement decay — the member who quietly defects while everyone else cooperates does best of all.</li>"
        + "<li>A rule does not have to catch everybody; it has to make the expected penalty larger than the prize.</li>"
        + "<li>A price can do what a ban could not, by making the private calculation and the collective interest agree.</li>"
        + "<li>Self-interest produces good outcomes when the person deciding bears the full cost of deciding — a claim about an arrangement, not a law of nature.</li></ol>"
      },
      { title: "Where you will meet this again", html:
        '<div class="at-a-glance">'
        + '<div class="item"><div class="k">Groundwater, Punjab &amp; Maharashtra</div><div class="v">Free power made it worse; metering and crop-switching are current attempts</div></div>'
        + '<div class="item"><div class="k">Air over Indian cities</div><div class="v">Odd-even rules (a quota), congestion charges (a price)</div></div>'
        + '<div class="item"><div class="k">Fisheries off Kerala &amp; Gujarat</div><div class="v">Trawling bans, mesh rules, individual transferable quotas</div></div>'
        + '<div class="item"><div class="k">The atmosphere</div><div class="v">Carbon taxes, cap-and-trade, treaties nobody can enforce</div></div>'
        + '</div>'
      },
      { title: "Further reading", html:
        "<ul><li>Samuelson and Nordhaus, <em>Economics</em>, on externalities and public goods.</li>"
        + "<li>Garrett Hardin, <em>The Tragedy of the Commons</em> (1968) — the source of the phrase, worth reading critically.</li>"
        + "<li>Elinor Ostrom, <em>Governing the Commons</em> — real villages that managed commons well, without the state or private ownership.</li></ul>"
      }
    ])
  ) + '</section>';
}

        + "<li>Feel the gain from specialising in your abundant factor’s good and trading for the rest.</li>"

      { title: "The setup", html:

  } else if(parts[0] === "games" && parts.length === 3){
    var pages = RESOURCE_PAGES[parts[1]];
    html = (pages && pages[parts[2]]) ? pages[parts[2]](parts[1]) : renderNotFound();
  } else {
    html = renderNotFound();
  }

  app.innerHTML = html;
  setActiveNav(top);
  var todayEl = document.getElementById("today");
  if(todayEl) todayEl.textContent = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  wireQuiz();
  window.scrollTo({top:0, behavior:"instant"});
}

/* One delegated listener for every accordion header and tab button on the
   site — works across route changes since it’s bound to document, not to
   elements that get replaced on every render. */
document.addEventListener("click", function(e){
  var tabBtn = e.target.closest(".tab-btn");
  if(tabBtn){
    var wrap = tabBtn.closest(".tabs");
    var key = tabBtn.getAttribute("data-tab");
    wrap.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.toggle("active", b === tabBtn); });
    wrap.querySelectorAll(".tab-panel").forEach(function(p){ p.hidden = (p.getAttribute("data-tab") !== key); });
    if(wrap.getAttribute("data-sync") === "round"){ activeRound = parseInt(key, 10); }
    return;
  }
  var accHead = e.target.closest(".accordion-header");
  if(accHead){
    var item = accHead.closest(".accordion-item");
    var willOpen = !item.classList.contains("open");
    item.classList.toggle("open", willOpen);
    accHead.setAttribute("aria-expanded", String(willOpen));
    item.querySelector(".accordion-panel").hidden = !willOpen;
    return;
  }
});

renderTicker();
logVisit(); // once per real page open — not on every in-app hash navigation
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);
route();
</script>
