<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinking Like an Economist</title>
<meta name="description" content="Classroom games for teaching economics by discovery, by Rupa Korde.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ============================================================
   THINKING LIKE AN ECONOMIST — design tokens
   Ledger/exchange-board world: ruled paper, posted prices, a
   transit map of how topics connect. Blue as the house colour,
   chalk-amber as the one quirky accent, used sparingly.
   ============================================================ */
:root{
  --paper:      #F2F5FC;
  --paper-2:    #E6EBF8;
  --panel:      #FFFFFF;
  --ink:        #101A30;
  --ink-soft:   #4B5A7A;
  --ink-faint:  #7C8AAC;
  --rule:       #C7D2EC;
  --rule-strong:#9DAEDA;

  --blue:       #2951D8;
  --blue-deep:  #142A61;
  --blue-soft:  #DDE6FC;
  --blue-line:  #2951D8;

  --chalk:      #92650F;
  --chalk-bg:   #F3E3C4;
  --chalk-line: #C6890F;

  --rise:       #1E7A5A;
  --rise-bg:    #DCEFE6;
  --rise-line:  #1E9A6E;

  --stamp:      #A8322A;
  --stamp-bg:   #F5E1DE;
  --stamp-line: #B23A31;

  --violet:     #5B3FA0;
  --violet-bg:  #E7E0F5;
  --violet-line:#6B48BF;

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --max: 1040px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:      #0A0F1E;
    --paper-2:    #101830;
    --panel:      #121A33;
    --ink:        #E9EDF9;
    --ink-soft:   #A9B6D6;
    --ink-faint:  #7686AC;
    --rule:       #26315A;
    --rule-strong:#37448A;

    --blue:       #7E9CFF;
    --blue-deep:  #C4D2FF;
    --blue-soft:  #1B2650;

    --chalk:      #E3B15C;
    --chalk-bg:   #362A12;
    --chalk-line: #C88E2F;

    --rise:       #4FCB9C;
    --rise-bg:    #10291F;
    --rise-line:  #3FBE93;

    --stamp:      #E58177;
    --stamp-bg:   #331714;
    --stamp-line: #C24A40;

    --violet:     #B29CE8;
    --violet-bg:  #241A3E;
    --violet-line:#8A6BD1;
  }
}
:root[data-theme="dark"]{
  --paper:      #0A0F1E;
  --paper-2:    #101830;
  --panel:      #121A33;
  --ink:        #E9EDF9;
  --ink-soft:   #A9B6D6;
  --ink-faint:  #7686AC;
  --rule:       #26315A;
  --rule-strong:#37448A;

  --blue:       #7E9CFF;
  --blue-deep:  #C4D2FF;
  --blue-soft:  #1B2650;

  --chalk:      #E3B15C;
  --chalk-bg:   #362A12;
  --chalk-line: #C88E2F;

  --rise:       #4FCB9C;
  --rise-bg:    #10291F;
  --rise-line:  #3FBE93;

  --stamp:      #E58177;
  --stamp-bg:   #331714;
  --stamp-line: #C24A40;

  --violet:     #B29CE8;
  --violet-bg:  #241A3E;
  --violet-line:#8A6BD1;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
img{ max-width:100%; display:block; }
a{ color: var(--blue); text-decoration: none; }
a:hover{ text-decoration: underline; }
:focus-visible{ outline: 2px solid var(--blue); outline-offset: 2px; }

h1,h2,h3,h4{
  font-family: var(--font-display);
  color: var(--ink);
  line-height: 1.15;
  margin: 0 0 .5em;
  text-wrap: balance;
  font-weight: 600;
}
h1{ font-size: clamp(2.1rem, 4.4vw, 3.2rem); }
h2{ font-size: clamp(1.5rem, 2.6vw, 1.9rem); }
h3{ font-size: 1.25rem; }
p{ margin: 0 0 1em; max-width: 65ch; }
.prose p, .prose li{ max-width: 68ch; }

.container{ max-width: var(--max); margin: 0 auto; padding: 0 24px; }
.eyebrow{
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: .1em;
  font-size: .74rem;
  color: var(--blue);
}
.mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------------- header + ticker ---------------- */
.site-header{
  position: sticky; top:0; z-index: 30;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.ticker-wrap{
  background: var(--blue-deep);
  color: #fff;
  overflow: hidden;
  white-space: nowrap;
  border-bottom: 1px solid var(--rule-strong);
}
.ticker{
  display:inline-flex;
  gap: 48px;
  padding: 6px 0;
  animation: ticker-scroll 42s linear infinite;
  font-family: var(--font-mono);
  font-size: .78rem;
  letter-spacing: .03em;
}
.ticker span{ opacity:.92; }
.ticker span b{ color: #FFD98A; font-weight:600; }
@keyframes ticker-scroll{
  from{ transform: translateX(0); }
  to{ transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce){
  .ticker{ animation: none; }
}

.nav-row{
  display:flex; align-items:center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding: 16px 0;
}
.brand{
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.25rem;
  color: var(--ink);
  display:flex; flex-direction:column; line-height:1.1;
}
.brand small{
  font-family: var(--font-mono);
  font-size: .62rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 500;
}
.site-nav{ display:flex; gap: 22px; flex-wrap: wrap; }
.site-nav a{
  color: var(--ink); font-weight: 600; font-size: .93rem;
  padding: 4px 0; border-bottom: 2px solid transparent;
}
.site-nav a:hover{ text-decoration:none; border-bottom-color: var(--rule-strong); }
.site-nav a.active{ border-bottom-color: var(--blue); color: var(--blue); }

/* ---------------- buttons / tags / stamp ---------------- */
.btn{
  display:inline-flex; align-items:center; gap:.4em;
  font-family: var(--font-body); font-weight: 700; font-size: .95rem;
  padding: 12px 20px; border-radius: 3px;
  border: 1px solid var(--blue); background: var(--blue); color: #fff !important;
  cursor:pointer; text-decoration:none !important;
}
.btn:hover{ background: var(--blue-deep); border-color: var(--blue-deep); }
.btn.ghost{ background: transparent; color: var(--blue) !important; }
.btn.ghost:hover{ background: var(--blue-soft); }
.btn.disabled{ opacity:.55; cursor:not-allowed; pointer-events:none; background: var(--ink-faint); border-color: var(--ink-faint); }

.tag{
  font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase;
  letter-spacing: .05em; padding: 3px 9px; border-radius: 2px;
  background: var(--blue-soft); color: var(--blue);
  display:inline-block;
}
.tag.live{ background: var(--rise-bg); color: var(--rise); }
.tag.chalk{ background: var(--chalk-bg); color: var(--chalk); }
.tag.stamp{ background: var(--stamp-bg); color: var(--stamp); }
.tag.violet{ background: var(--violet-bg); color: var(--violet); }

.stamp-badge{
  display:inline-block;
  font-family: var(--font-mono);
  font-size: .68rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--stamp);
  border: 1.5px solid var(--stamp);
  padding: 5px 10px;
  border-radius: 2px;
  transform: rotate(-3deg);
  background: var(--stamp-bg);
}

/* ---------------- hero / ledger spread ---------------- */
.hero{ padding: 56px 0 40px; border-bottom: 1px solid var(--rule); }
.ledger-spread{
  display:grid; grid-template-columns: 1.3fr .9fr; gap: 40px; align-items: start;
}
@media (max-width: 760px){ .ledger-spread{ grid-template-columns: 1fr; } }
.hero p.lead{ font-size: 1.13rem; color: var(--ink-soft); max-width: 46ch; }
.hero-actions{ display:flex; gap: 14px; margin-top: 22px; flex-wrap: wrap; }

.index-card{
  background: var(--panel);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--blue);
  border-radius: 3px;
  padding: 22px 24px;
}
.index-card h4{
  font-family: var(--font-mono); font-size: .72rem; letter-spacing:.1em;
  text-transform: uppercase; color: var(--ink-faint); margin: 0 0 14px;
}
.stat-row{
  display:flex; justify-content: space-between; align-items: baseline;
  padding: 8px 0; border-bottom: 1px dashed var(--rule);
  font-size: .92rem;
}
.stat-row:last-child{ border-bottom:none; }
.stat-row .n{ font-family: var(--font-mono); font-weight:600; color: var(--blue); font-size: 1rem; }

/* ---------------- sections ---------------- */
section{ padding: 56px 0; }
section.alt{ background: var(--paper-2); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.section-head{ max-width: 620px; margin-bottom: 30px; }
.section-head p{ color: var(--ink-soft); }

.grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 22px; }
.card{
  background: var(--panel); border: 1px solid var(--rule); border-radius: 4px;
  padding: 24px; display:flex; flex-direction:column;
}
.card h3{ margin-bottom: .3em; }
.card .muted{ color: var(--ink-soft); font-size: .93rem; }
.card .tags{ margin: 10px 0 14px; display:flex; gap:8px; flex-wrap:wrap; }
.card .spacer{ flex:1; }

/* ---------------- subway map ---------------- */
.map-legend{ display:flex; gap: 18px; flex-wrap: wrap; margin-top: 18px; font-size: .85rem; color: var(--ink-soft); }
.map-legend .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align: -1px; }
.subway-fig{ margin: 0; }
.subway-fig svg{ width:100%; height:auto; display:block; }
.subway-fig figcaption{ margin-top: 14px; color: var(--ink-soft); font-size: .88rem; }
.subway-fig a text{ fill: var(--ink); font-family: var(--font-body); }
.subway-fig a:hover text{ fill: var(--blue); }
.subway-fig a:hover circle.station{ stroke-width: 4; }

/* ---------------- game overview / notes ---------------- */
.game-head{ display:flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items:flex-start; margin-bottom: 8px; }
.subnav{
  display:flex; gap: 6px; flex-wrap: wrap; margin: 22px 0 34px;
  border-bottom: 1px solid var(--rule); padding-bottom: 2px;
}
.subnav a{
  font-family: var(--font-mono); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--ink-soft); padding: 8px 12px; border-bottom: 2px solid transparent;
}
.subnav a:hover{ text-decoration:none; color: var(--ink); }
.subnav a.active{ color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }

.ledger-note{
  border-left: 3px solid var(--rule-strong);
  padding-left: 22px;
  position: relative;
}
.ledger-note::before{
  content:"";
  position:absolute; left:-1px; top:0; bottom:0; width:1px;
  background: repeating-linear-gradient(to bottom, var(--rule-strong) 0 6px, transparent 6px 12px);
  display:none;
}
.at-a-glance{
  display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 16px; margin: 20px 0 30px;
}
.at-a-glance .item{
  background: var(--paper-2); border: 1px solid var(--rule); border-radius: 3px;
  padding: 12px 14px;
}
.at-a-glance .item .k{ font-family: var(--font-mono); font-size: .68rem; text-transform:uppercase; letter-spacing:.08em; color: var(--ink-faint); }
.at-a-glance .item .v{ font-size: .95rem; margin-top: 3px; }

.category-block{
  border: 1px solid var(--rule); border-radius: 4px; padding: 20px 22px; margin-bottom: 18px;
  background: var(--panel);
}
.category-block h4{ font-family: var(--font-display); font-size: 1.08rem; margin: 0 0 6px; }
.category-block .count{ font-family: var(--font-mono); font-size: .78rem; color: var(--ink-faint); }
.condition-example{
  border-top: 1px dashed var(--rule); margin-top: 12px; padding-top: 12px;
}
.condition-example .title{ font-weight: 600; font-size: .95rem; }
.condition-example .debrief{ color: var(--blue); font-size: .85rem; font-family: var(--font-mono); }
.discussion-q{
  margin-top: 12px; padding: 10px 14px; background: var(--chalk-bg); border-radius: 3px;
  font-size: .9rem; color: var(--chalk);
}

.glossary dt{ font-weight: 700; font-family: var(--font-display); font-size: 1.02rem; margin-top: 16px; }
.glossary dd{ margin: 4px 0 0; color: var(--ink-soft); }

/* ---------------- quiz ---------------- */
.quiz-progress{
  font-family: var(--font-mono); font-size: .85rem; color: var(--ink-soft); margin-bottom: 18px;
}
.quiz-q{
  border: 1px solid var(--rule); border-radius: 4px; padding: 18px 20px; margin-bottom: 16px; background: var(--panel);
}
.quiz-q .qn{ font-family: var(--font-mono); font-size: .74rem; color: var(--ink-faint); }
.quiz-q .qtext{ font-weight: 600; margin: 6px 0 12px; }
.quiz-opt{ display:flex; align-items:flex-start; gap: 10px; padding: 8px 0; cursor:pointer; font-size: .95rem; }
.quiz-opt input{ margin-top: 4px; accent-color: var(--blue); }
.quiz-q.graded.correct{ border-color: var(--rise-line); }
.quiz-q.graded.wrong{ border-color: var(--stamp-line); }
.quiz-explain{ display:none; margin-top: 10px; padding: 10px 12px; border-radius: 3px; font-size: .88rem; }
.quiz-q.graded .quiz-explain{ display:block; }
.quiz-q.graded.correct .quiz-explain{ background: var(--rise-bg); color: var(--rise); }
.quiz-q.graded.wrong .quiz-explain{ background: var(--stamp-bg); color: var(--stamp); }
.quiz-opt.opt-correct{ font-weight:700; }
.quiz-score{
  border: 2px solid var(--blue); border-radius: 4px; padding: 20px 24px; margin-bottom: 24px;
  background: var(--blue-soft);
  display:none;
}
.quiz-score.show{ display:block; }
.quiz-score .big{ font-family: var(--font-mono); font-size: 2rem; color: var(--blue); font-weight:600; }

/* ---------------- about ---------------- */
.about-layout{ display:grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: start; }
@media (max-width: 640px){ .about-layout{ grid-template-columns: 1fr; } }
.portrait{
  width: 100%; aspect-ratio: 1; border-radius: 4px; border: 1px solid var(--rule);
  background: var(--paper-2); display:flex; align-items:center; justify-content:center;
  color: var(--ink-faint); font-family: var(--font-mono); font-size: .78rem; text-align:center; padding: 16px;
  overflow:hidden;
}
.portrait img{ width:100%; height:100%; object-fit:cover; }

.editor-note{
  border-left: 3px solid var(--chalk-line); background: var(--chalk-bg); padding: 10px 14px;
  font-size: .87rem; color: var(--chalk); margin: 0 0 1.4em; border-radius: 0 3px 3px 0;
}
.editor-note strong{ color: var(--ink); }

/* ---------------- terms ---------------- */
.clause{ margin-bottom: 34px; }
.clause h2{ display:flex; align-items:baseline; gap: 10px; }
.clause .concept{ font-family: var(--font-mono); font-size: .68rem; text-transform:uppercase; letter-spacing:.08em; color: var(--blue); background: var(--blue-soft); padding: 3px 8px; border-radius: 2px; }

.empty-state{ border: 1px dashed var(--rule); border-radius: 4px; padding: 32px; text-align: center; color: var(--ink-soft); }

/* ---------------- footer ---------------- */
.site-footer{ border-top: 1px solid var(--rule); padding: 30px 0; color: var(--ink-soft); font-size: .87rem; }
.site-footer .container{ display:flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.site-footer a{ color: var(--ink-soft); }

</style>
</head>

<header class="site-header">
  <div class="ticker-wrap">
    <div class="container">
      <div class="ticker" id="ticker"></div>
    </div>
  </div>
  <div class="container nav-row">
    <a class="brand" href="#/">Thinking Like an Economist<small>Games for teaching economics</small></a>
    <nav class="site-nav" id="site-nav">
      <a href="#/" data-route="">Home</a>

      <a href="#/about" data-route="about">About</a>
      <a href="#/terms" data-route="terms">Terms of Use</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="site-footer">
  <div class="container">
    <span>&copy; <span id="year"></span> Rupa Korde — Thinking Like an Economist</span>
    <a href="#/terms">Terms of Use</a>
  </div>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

/* ============================================================
   DATA
   Add a new game: add an entry to GAMES, then a matching entry
   in TEACHING_NOTES / DEBRIEF_NOTES / STUDENT_NOTES / QUIZZES
   keyed by the same id. Add a new topic: add to TOPICS.
   ============================================================ */

var GAMES = {
  "trade-game": {
    id: "trade-game",
    title: "The International Trade Game",
    tagline: "A live classroom simulation of comparative advantage, tariffs, and trade policy.",
    description: "Students are split into six “countries” with unequal tools and starting cash, and must manufacture and trade paper shapes for profit while the instructor fires real-time conditions — tariffs, subsidies, embargoes, quotas, cartels — into the live market. Based on John Sloman’s International Trade Game (Economics Network, 2002).",
    course: "ECON102 · Thinking Like an Economist · FLAME University",
    format: "Live classroom · 45 minutes · phones + projector",
    status: "live",
    statusLabel: "Field-tested",
    tags: ["Comparative advantage", "Trade policy", "Classroom simulation"],
    link: null,
    linkLabel: "Launch — link coming soon",
    stats: { conditions: 51, categories: 6, quiz: 20, classSize: "40 students · 6 countries" }
  }
};

var TOPICS = [
  {
    title: "International Trade",
    description: "Comparative advantage, tariffs, subsidies, quotas, and why countries trade at all — explored hands-on through The International Trade Game.",
    games: ["trade-game"]
  }
];

var TICKER_ITEMS = [
  "OPPORTUNITY COST — the best alternative foregone, never zero",
  "COMPARATIVE ADVANTAGE — gains from trade even if you’re worse at everything",
  "SCARCITY — the one constraint that never takes a break",
  "TERMS OF TRADE — index steady, expectations volatile",
  "SUNK COSTS — already spent; stop letting them vote",
  "DERIVED DEMAND — the input is only worth what it helps make",
  "MARGINAL UTILITY — diminishing, same as ever",
  "MORAL HAZARD — see Terms of Use, Clause 4",
  "PRICE SIGNAL — useless without capacity to act on it",
  "GAINS FROM TRADE — rarely split evenly, always real"
];

var CONDITION_CATEGORIES = [
  {
    key: "Demand & supply", count: 9, color: "blue",
    blurb: "Shocks to what the market wants and what it can make — surges, gluts, and who actually has the capacity to respond to a moving price.",
    examples: [
      { title: "Demand surge: triangles", debrief: "Price elasticity of supply; capital as a constraint on response (Session 8, 15)" },
      { title: "Glut: rectangle price collapses", debrief: "Supply outrunning demand; sunk effort; terms of trade (Session 15)" }
    ],
    question: "When the price of triangles spiked, who actually produced more — and who just watched the price rise?"
  },
  {
    key: "Trade policy", count: 11, color: "stamp",
    blurb: "Tariffs, quotas, embargoes, subsidies, and retaliation — the policy toolkit, and who ends up paying for each one.",
    examples: [
      { title: "Import tariff imposed", debrief: "Who bears a tariff; protection as a transfer (Session 3–4, Tariffs deck)" },
      { title: "Retaliatory tariff", debrief: "Symmetry of trade barriers; retaliation and trade wars (Session 3–4)" }
    ],
    question: "A tariff is levied on the seller’s invoice — so why did the debrief keep insisting the buyer might be the one who actually paid it?"
  },
  {
    key: "Institutions & market failure", count: 10, color: "violet",
    blurb: "Cartels, externalities, public goods, asymmetric information — the ways a market can fail even with nobody breaking a rule.",
    examples: [
      { title: "Cartel forms among scissors-holders", debrief: "Cartels, collusion, the incentive to defect (Session 11, 30)" },
      { title: "Pollution levy imposed", debrief: "External cost, making the polluter pay, incidence of a flat charge (Session 19)" }
    ],
    question: "Every cartel member does better if it holds — so why did most of the cartels in the room collapse within minutes?"
  },
  {
    key: "Technology & capital", count: 8, color: "rise",
    blurb: "Who owns the compass, the set square, the patent — and what happens to trade patterns when a tool is unevenly distributed.",
    examples: [
      { title: "Foreign direct investment offered", debrief: "FDI, technology transfer, who captures the gain (Session 26)" },
      { title: "Patent granted on a shape", debrief: "Intellectual property as a transfer; monopoly rent (Session 13)" }
    ],
    question: "Circles needed a compass and right triangles needed a set square. How much of the final scoreboard was decided before a single trade happened?"
  },
  {
    key: "Macro & finance", count: 11, color: "chalk",
    blurb: "Exchange rates, debt, bubbles, inflation — the economy-wide forces that move every country’s balance at once, not just one market’s price.",
    examples: [
      { title: "Currency devalued", debrief: "Exchange rates and competitiveness (Session 29)" },
      { title: "Speculative bubble in one shape", debrief: "Bubbles, herding, opportunity cost of chasing a price (Session 14)" }
    ],
    question: "A speculative bubble made one shape look like the best trade in the room — right up until it wasn’t. Who got out in time, and why?"
  },
  {
    key: "Labour & society", count: 2, color: "blue",

var GLOSSARY = [
  { term: "Comparative advantage", def: "Being relatively better at producing one thing than another — gains from trade come from this, not from being the best at everything." },
  { term: "Opportunity cost", def: "The value of the next-best thing you gave up to do what you chose instead." },
  { term: "Tariff", def: "A charge deducted from a sale when a good crosses a border — someone pays it, but not always who you’d expect." },
  { term: "Subsidy", def: "A payment added to a sale, usually to make a country’s own producers more competitive." },
  { term: "Quota", def: "A cap on how much of something can be sold at the normal price before a worse rate kicks in." },
  { term: "Embargo", def: "A ban on selling directly — production can often continue; only the direct sale is blocked." },
  { term: "Cartel", def: "A group that agrees to hold a price together — and that every member has an incentive to quietly break." },
  { term: "Terms of trade", def: "How much of what you buy you can get for what you sell, at current prices." },
  { term: "Derived demand", def: "An input is valuable because of what it helps produce — not for its own sake." }
];

    + '</div>'

    + '<h2>Three design decisions worth protecting</h2>'
    + '<ul>'
    + '<li><strong>Nobody is told there are three kinds of country.</strong> The join codes, banners and leaderboard are all built to hold this until the results phase — don’t narrate the tiers yourself while circulating.</li>'
    + '<li><strong>Nothing fires automatically.</strong> Every price move, tariff and payment happens because you tapped it. That’s deliberate — it keeps the causal story legible for the debrief.</li>'
    + '<li><strong>The suggestion panel holds back on purpose.</strong> It won’t propose a condition until countries have actually sold something — an early shock with no evidence behind it would just tip off the lesson before it happens.</li>'
    + '</ul>'

    + '<h2>What to watch for while it runs</h2>'
    + '<p>A few of the condition library’s own field notes, verbatim — the kind of thing worth noticing live rather than only in the debrief:</p>'
    + '<ul>'
    + '<li>“Who can actually respond? A price signal is useless to a country with no set square.”</li>'
    + '<li>“A cartel is fragile mainly because each individual member can usually gain more by secretly undercutting the agreed price than by sticking to it.”</li>'
    + '<li>“A country that held onto shapes, betting the price would rise later, was acting on an expectation — not a guarantee.”</li>'
    + '</ul>'

    + '<p>When trading closes, move straight into the <a href="#/games/'+id+'/debrief-note">debrief note</a>, then assign the <a href="#/games/'+id+'/quiz">quiz</a> as an individual check afterward.</p>'
  ) + '</section>';
}

/* ---- Debrief note ---- */
function renderDebriefNote(id){
  var g = GAMES[id];
  if(!g) return renderNotFound();
  var blocks = CONDITION_CATEGORIES.map(function(c){
    var ex = c.examples.map(function(e){
      return '<div class="condition-example"><div class="title">'+esc(e.title)+'</div><div class="debrief">'+esc(e.debrief)+'</div></div>';
    }).join("");
    return '<div class="category-block">'
      + '<h4>'+esc(c.key)+' <span class="count">· '+c.count+' conditions</span></h4>'
      + '<p class="muted" style="margin-bottom:0">'+esc(c.blurb)+'</p>'
      + ex
      + '<div class="discussion-q">Ask the room: '+esc(c.question)+'</div>'
      + '</div>';
  }).join("");

  return '<section class="hero" style="padding-bottom:0">' + pageChrome(''
    + '<span class="eyebrow">Debrief note</span>'
    + '<h1>Debriefing '+esc(g.title)+'</h1>'
    + '<p class="lead">Structured around the same six categories the condition library uses, so the debrief can follow whatever actually fired in your session.</p>'
    + subNav(id, "debrief-note")
  ) + '</section>'
  + '<section class="prose ledger-note" style="padding-top:0">' + pageChrome(''
    + '<h2>Open with the reveal</h2>'
    + '<p>Results reveal the tier structure for the first time — that reveal is the dramatic hinge the whole session is built around. Before showing it, ask the room to guess which countries were high-, middle- and low-income. The gap between their guess and the truth is the first debrief point, before you’ve said a word of theory.</p>'

    + '<h2>Then work through what actually fired</h2>'
    + '<p>Below are the six categories in the condition library, each with two real examples and a question to put to the room. Skip any category that never fired in your session — debrief what happened, not the whole catalogue.</p>'
    + blocks

    + '<h2>Close on inequality, not on prices</h2>'
    + '<p>Whatever conditions fired, the biggest driver of the final scoreboard was almost always the unequal envelope every country opened before trading began — not any single policy shock. That’s the point worth landing last: prices, tariffs and cartels all happened on top of an unevenness the game never pretended to remove.</p>'
  ) + '</section>';
}

/* ---- Quiz ---- */
function renderQuiz(id){
  var g = GAMES[id];
  var qs = QUIZZES[id];
  if(!g || !qs) return renderNotFound();
  var qHtml = qs.map(function(q, i){
    var opts = q.options.map(function(opt, oi){
      return '<label class="quiz-opt"><input type="radio" name="'+q.id+'" value="'+oi+'"><span>'+esc(opt)+'</span></label>';
    }).join("");
    return '<div class="quiz-q" data-qid="'+q.id+'" data-correct="'+q.correct+'">'
      + '<div class="qn">Question '+(i+1)+' of '+qs.length+'</div>'
      + '<div class="qtext">'+esc(q.q)+'</div>'
      + '<div class="quiz-opts">'+opts+'</div>'
      + '<div class="quiz-explain">'+esc(q.explain)+'</div>'
      + '</div>';
  }).join("");

  return '<section class="hero" style="padding-bottom:0">' + pageChrome(''
    + '<span class="eyebrow">Quiz · '+qs.length+' questions</span>'
    + '<h1>Individual quiz — '+esc(g.title)+'</h1>'
    + '<p class="lead">Every question is drawn from the actual debrief themes — specialisation, price signals, cartels, comparative advantage, terms of trade, world inequality — phrased around what everyone in the room actually did, not generic trivia. Answer from memory of playing, then check yourself.</p>'
    + subNav(id, "quiz")
  ) + '</section>'
  + '<section style="padding-top:0">' + pageChrome(''
    + '<div class="quiz-score" id="quiz-score"></div>'
    + '<form id="quiz-form">'
    +   qHtml
    +   '<div style="display:flex;gap:12px;margin-top:8px">'
    +     '<button type="submit" class="btn">Grade my answers</button>'
    +     '<button type="button" class="btn ghost" id="quiz-reset">Try again</button>'
    +   '</div>'
    + '</form>'
  ) + '</section>';
}

function wireQuiz(){
  var form = document.getElementById("quiz-form");
  if(!form) return;
  var scoreBox = document.getElementById("quiz-score");
  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    var qDivs = form.querySelectorAll(".quiz-q");
    var score = 0;
    qDivs.forEach(function(div){
      var correct = parseInt(div.getAttribute("data-correct"), 10);
      var checked = div.querySelector("input:checked");
      var chosen = checked ? parseInt(checked.value, 10) : -1;
      var right = chosen === correct;
      if(right) score++;
      div.classList.remove("graded","correct","wrong");
      div.classList.add("graded", right ? "correct" : "wrong");
      div.querySelectorAll(".quiz-opt").forEach(function(lab, i){
        lab.classList.toggle("opt-correct", i === correct);
      });
    });
    scoreBox.innerHTML = '<span class="big">'+score+' / '+qDivs.length+'</span><p style="margin:8px 0 0">'+(
      score === qDivs.length ? "Perfect — you were paying attention while trading, not just while cutting shapes." :
      score >= qDivs.length*0.7 ? "Solid. Re-read the explanations on the ones you missed — they’re the debrief in miniature." :
      "Worth revisiting the debrief note before retaking this — the explanations below are the fastest way back in."
    )+'</p>';
    scoreBox.classList.add("show");
    scoreBox.scrollIntoView({behavior:"smooth", block:"start"});
  });
  document.getElementById("quiz-reset").addEventListener("click", function(){
    form.reset();
    form.querySelectorAll(".quiz-q").forEach(function(div){ div.classList.remove("graded","correct","wrong"); });
    scoreBox.classList.remove("show");
    window.scrollTo({top:0, behavior:"smooth"});
  });
}

    + '<span class="eyebrow">Student note</span>'
    + '<h1>Before you play</h1>'

  ) + '</section>'
  + '<section class="prose ledger-note" style="padding-top:0">' + pageChrome(''
    + '<h2>What you’re actually doing</h2>'
    + '<p>You’ve been assigned to a country, along with a small team. Your envelope has some tools and some starting cash — not the same as every other country’s. Your job is to manufacture paper shapes to an exact specification and sell them to the trader at the posted price, which can move at any time.</p>'
    + '<ul>'
    + '<li>Declare what you’re holding at the start, and again at the end — both numbers matter.</li>'
    + '<li>Prices are posted and can change without warning. You’ll see the change; you won’t always see why.</li>'
    + '<li>You can negotiate directly with other countries as well as sell to the trader.</li>'
    + '<li>Nothing in the game happens on a fixed clock or in rounds — conditions arrive whenever the instructor fires them.</li>'
    + '</ul>'

    + '<h2>A few honest tips</h2>'
    + '<ul>'
    + '<li>Figure out early what your team can make well, and let people specialise rather than everyone doing a bit of everything.</li>'
    + '<li>Watch what other countries are struggling to produce — that gap is usually where a trade is worth making.</li>'
    + '<li>A deal with no way to enforce it only holds if both sides keep gaining from it. Plan accordingly.</li>'
    + '<li>Don’t assume the price you see now is the price you’ll get later — in either direction.</li>'
    + '</ul>'

    + '<h2>Terms you’ll want to know</h2>'
    + '<dl class="glossary">' + glossary + '</dl>'

    + '<div class="editor-note" style="margin-top:26px"><strong>One thing this note won’t tell you:</strong> not everything about how countries were set up is explained here. That’s deliberate — part of the point of the session is finding it out yourself.</div>'
  ) + '</section>';
}

function renderNotFound(){
  return '<section class="hero">' + pageChrome('<h1>Not found yet</h1><p class="lead">That page doesn’t exist — <a href="#/">back to the dashboard</a>.</p>') + '</section>';
}

/* ============================================================
   ROUTER
   ============================================================ */
function renderTicker(){
  var el = document.getElementById("ticker");
  var items = TICKER_ITEMS.concat(TICKER_ITEMS); // doubled for seamless loop
  el.innerHTML = items.map(function(t){
    var parts = t.split(/—/);
    if(parts.length > 1){
      return '<span><b>'+esc(parts[0].trim())+'</b> — '+esc(parts.slice(1).join("—").trim())+'</span>';
    }
    return '<span>'+esc(t)+'</span>';
  }).join("");
}

function setActiveNav(topRoute){
  document.querySelectorAll('#site-nav a').forEach(function(a){
    a.classList.toggle('active', a.getAttribute('data-route') === topRoute);
  });
}

function route(){
  var hash = location.hash.replace(/^#\/?/, "").replace(/\/$/, "");
  var parts = hash ? hash.split("/") : [];
  var app = document.getElementById("app");
  var html = "";
  var top = parts[0] || "";

  if(parts.length === 0){
    html = renderHome();
  } else if(parts[0] === "games" && parts.length === 1){
    html = renderGames();
  } else if(parts[0] === "topics"){
    html = renderTopics();
  } else if(parts[0] === "about"){
    html = renderAbout();
  } else if(parts[0] === "terms"){
    html = renderTerms();
  } else if(parts[0] === "games" && parts.length === 2){
    html = renderGameOverview(parts[1]);
  } else if(parts[0] === "games" && parts.length === 3){
    var sub = parts[2];
    if(sub === "teaching-note") html = renderTeachingNote(parts[1]);
    else if(sub === "debrief-note") html = renderDebriefNote(parts[1]);
    else if(sub === "quiz") html = renderQuiz(parts[1]);
    else if(sub === "student-note") html = renderStudentNote(parts[1]);
    else html = renderNotFound();
  } else {
    html = renderNotFound();
  }

  app.innerHTML = html;
  setActiveNav(top);
  var todayEl = document.getElementById("today");
  if(todayEl) todayEl.textContent = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  wireQuiz();
  window.scrollTo({top:0, behavior:"instant"});
}

renderTicker();
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);
route();
